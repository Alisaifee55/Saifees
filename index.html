    --orange:#E8703A; --orange-dark:#C85A28; --orange-light:#FCE3D3;

  button{cursor:pointer;border:none;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;}
  .btn-primary{background:var(--orange);color:#fff;width:100%;}
  .btn-secondary{background:var(--teal-light);color:var(--teal-dark);width:100%;}
  .btn-small{padding:6px 10px;font-size:12px;}
  .row{display:flex;gap:8px;}

  .tabbadge{position:absolute;top:2px;right:22%;background:var(--orange);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;}
  .muted{color:var(--muted);font-size:12px;}
  .memberrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F1EBE1;}
  .memberrow:last-child{border-bottom:none;}
  .pill{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid #ddd;background:#fff;}
  .pill.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .pill.off{background:var(--orange);color:#fff;border-color:var(--orange);}
  .calhead{background:var(--orange-light);border-radius:12px;padding:10px;text-align:center;font-weight:800;color:var(--orange-dark);letter-spacing:.5px;margin-bottom:12px;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .caldow{font-weight:700;font-size:12px;color:var(--muted);padding-bottom:4px;}
  .calday{border-radius:12px;padding:6px 2px 8px;min-height:70px;background:#fdfaf5;position:relative;}
  .calday .h{font-size:32px;font-weight:700;color:var(--teal);margin-top:2px;font-family:'FatemiQanz','Segoe UI',sans-serif;}
  .calday .g{font-size:10px;color:var(--muted);margin-top:2px;}
  .calday.today{background:var(--orange-light);border:2px solid var(--orange);}
  .calday.today .h{color:var(--orange-dark);}
  .calday.event .h{color:var(--teal);}
  .calday.past .h{color:var(--red);}
  .calday.greyday{background:#f5f2eb;}
  .calday.greyday .h{color:var(--grey);}
  .calday.greyday .g{color:#cfc8bd;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin:4px auto 0;}
  .notif-item{padding:8px 0;border-bottom:1px solid #f1ebe1;font-size:13px;}
  .msgline{padding:8px 10px;border-radius:12px;margin-bottom:4px;max-width:80%;font-size:13px;}
  .msg-me{background:var(--teal);color:#fff;margin-left:auto;}
  .msg-them{background:#f1ebe1;}
  .seen{font-size:10px;color:var(--muted);text-align:right;margin:-2px 2px 8px auto;max-width:80%;}

  .convo{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F1EBE1;cursor:pointer;}
  .convo:last-child{border-bottom:none;}
  .convo .preview{font-size:12px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .unreadbadge{background:var(--orange);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700;}
  .subtabs{display:flex;gap:8px;margin-bottom:12px;}
  .subtabs button{flex:1;}
  .subtabs button.active{background:var(--teal);color:#fff;}

/* ================= Hijri conversion ================= */
function gregorianToHijri(gy, gm, gd){
  let jd = Math.floor((1461*(gy + 4800 + Math.floor((gm-14)/12)))/4) +
           Math.floor((367*(gm-2-12*Math.floor((gm-14)/12)))/12) -
           Math.floor((3*Math.floor((gy+4900+Math.floor((gm-14)/12))/100))/4) +
           gd - 32075;
  let l = jd - 1948440 + 10632;
  let n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  let j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  let hm = Math.floor((24*l)/709);
  let hd = l - Math.floor((709*hm)/24);
  let hy = 30*n + j - 30;
  return {hy, hm, hd};
}
function hijriToGregorian(hy, hm, hd){
  const jd = hd + Math.ceil(29.5*(hm-1)) + (hy-1)*354 + Math.floor((3+11*hy)/30) + 1948440 - 1;
  let l = jd + 68569;
  const n = Math.floor((4*l)/146097);
  l = l - Math.floor((146097*n+3)/4);
  const i = Math.floor((4000*(l+1))/1461001);
  l = l - Math.floor((1461*i)/4) + 31;
  const j = Math.floor((80*l)/2447);
  const day = l - Math.floor((2447*j)/80);
  l = Math.floor(j/11);
  const month = j + 2 - 12*l;
  const year = 100*(n-49) + i + l;
  return new Date(year, month-1, day);
}
const HIJRI_MONTHS = ["Muharram","Safar","Rabi al-Awwal","Rabi al-Akhar","Jumada al-Ula","Jumada al-Akhira","Rajab","Sha'ban","Ramadan","Shawwal","Dhul Qadah","Dhul Hijjah"];
const HIJRI_MONTHS_AR = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
const ARABIC_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicNum(n){ return String(n).split('').map(c=>ARABIC_DIGITS[+c]||c).join(''); }
function ymdKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function findHijriMonthStart(hy, hm){
  let guess = hijriToGregorian(hy, hm, 1);
  for(let attempts=0; attempts<8; attempts++){
    const h = gregorianToHijri(guess.getFullYear(), guess.getMonth()+1, guess.getDate());
    if(h.hy===hy && h.hm===hm && h.hd===1) break;
    if(h.hy===hy && h.hm===hm){ guess.setDate(guess.getDate() + (1 - h.hd)); }
    else { const before = (h.hy<hy) || (h.hy===hy && h.hm<hm); guess.setDate(guess.getDate() + (before ? 1 : -1)); }
  }
  return guess;
}

/* ================= State ================= */
let DB = { families: [], members: [], events: [], votes: [], messages: [], notifications: [] };
let session = null;
let activeTab = 'calendar';
let hijriViewY = null, hijriViewM = null;
let notifOpen = false;
let msgSubTab = 'chats'; // 'chats' | 'announcements'
let msgWith = null;
let heartbeatTimer = null;

function saveSession(){ try{ localStorage.setItem('saifees_session', JSON.stringify(session)); }catch(e){} }
function loadSession(){ try{ const s = localStorage.getItem('saifees_session'); return s?JSON.parse(s):null; }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem('saifees_session'); }catch(e){} }

/* ================= Data access (Supabase) ================= */
async function loadAll(){
  const [fam, mem, ev, vt, ms, nt] = await Promise.all([
    sb.from('families').select('*'),
    sb.from('members').select('*'),
    sb.from('events').select('*'),
    sb.from('votes').select('*'),
    sb.from('messages').select('*').order('sent_at', {ascending:true}),
    sb.from('notifications').select('*').order('at', {ascending:false}),
  ]);
  if(fam.error) throw fam.error;
  DB = {
    families: fam.data||[], members: mem.data||[], events: ev.data||[],
    votes: vt.data||[], messages: ms.data||[], notifications: nt.data||[]
  };
}
function nameTaken(name, exceptId){
  return DB.members.some(m => m.name.toLowerCase()===name.toLowerCase() && m.id!==exceptId);
}
function membersOfFamily(familyId){ return DB.members.filter(m=>m.family_id===familyId); }
function findMember(id){ return DB.members.find(m=>m.id===id); }
function famName(id){ return (DB.families.find(f=>f.id===id)||{}).name || ''; }

async function addNotification(memberId, text){
  await sb.from('notifications').insert({member_id: memberId, text});
}
async function sendPush(target, message){
  try{ await sb.functions.invoke('send-push', { body: { target, message } }); }
  catch(e){ console.error('push failed', e); }
}

async function registerFamily(name, headName, password){
  if(DB.families.some(f=>f.name.toLowerCase()===name.toLowerCase())) return {error:'Family name already taken.'};
  if(nameTaken(headName)) return {error:'That member name is already used. Please add a surname/initial.'};
  const { data: fam, error: e1 } = await sb.from('families').insert({name, password}).select().single();
  if(e1) return {error:e1.message};
  const { data: mem, error: e2 } = await sb.from('members').insert({
    family_id: fam.id, name: headName, password, is_head: true, last_seen: new Date().toISOString()
  }).select().single();
  if(e2) return {error:e2.message};
  return { familyId: fam.id, memberId: mem.id, name: mem.name, role: 'head' };
}
async function loginUser(name, password){
  const fam = DB.families.find(f=>f.name.toLowerCase()===name.toLowerCase() && String(f.password)===String(password));
  if(fam){
    const head = DB.members.find(m=>m.family_id===fam.id && m.is_head);
    await sb.from('members').update({last_seen: new Date().toISOString()}).eq('id', head.id);
    return { familyId: fam.id, memberId: head.id, name: head.name, role:'head' };
  }
  const mem = DB.members.find(m=>m.name.toLowerCase()===name.toLowerCase() && String(m.password)===String(password) && !m.is_head);
  if(mem){
    await sb.from('members').update({last_seen: new Date().toISOString()}).eq('id', mem.id);
    return { familyId: mem.family_id, memberId: mem.id, name: mem.name, role:'member' };
  }
  return {error:'No match found.'};
}
async function addMember(familyId, name, password){
  if(nameTaken(name)) return {error:'That name is already used by someone else.'};
  const { data, error } = await sb.from('members').insert({family_id: familyId, name, password, is_head:false}).select().single();
  if(error) return {error:error.message};
  return {id:data.id, name:data.name};
}
async function editMemberName(memberId, newName){
  if(nameTaken(newName, memberId)) return {error:'That name is already used by someone else.'};
  const { error } = await sb.from('members').update({name:newName}).eq('id', memberId);
  if(error) return {error:error.message};
  return {ok:true};
}
async function createEventRow(gDate, deadline){
  const { error } = await sb.from('events').insert({g_date: gDate, deadline, status:'open'});
  if(error) return {error:error.message};
  return {ok:true};
}
async function toggleEventRow(eventId){
  const ev = DB.events.find(e=>e.id===eventId);
  const { error } = await sb.from('events').update({status: ev.status==='closed'?'open':'closed'}).eq('id', eventId);
  if(error) return {error:error.message};
  return {ok:true};
}
async function castVoteRow(eventId, memberId, meal, response, submittedBy){
  const { error } = await sb.from('votes').upsert({
    event_id: eventId, member_id: memberId, meal, response, submitted_by: submittedBy, updated_at: new Date().toISOString()
  }, { onConflict: 'event_id,member_id,meal' });
  if(error) return {error:error.message};
  const ev = DB.events.find(e=>e.id===eventId);
  const dateLabel = ev ? new Date(ev.g_date).toDateString() : '';
  await addNotification(memberId, `Your ${meal} RSVP for ${dateLabel} was set to ${response}.`);
  sendPush(memberId, `Your ${meal} RSVP for ${dateLabel} was set to ${response}.`);
  return {ok:true};
}
async function sendChatMessage(fromId, toId, text){
  const { error } = await sb.from('messages').insert({from_id: fromId, to_id: toId, text});
  if(error) return {error:error.message};
  const sender = findMember(fromId);
  await addNotification(toId, `New message from ${sender?sender.name:'someone'}: "${text}"`);
  sendPush(toId, `New message from ${sender?sender.name:'someone'}: "${text}"`);
  return {ok:true};
}
async function markMessagesRead(fromId, toId){
  await sb.from('messages').update({read_at: new Date().toISOString()})
    .eq('from_id', fromId).eq('to_id', toId).is('read_at', null);
}
async function sendReminderRow(eventId){
  const ev = DB.events.find(e=>e.id===eventId);
  const dateLabel = ev ? new Date(ev.g_date).toDateString() : '';
  let count = 0;
  for(const m of DB.members){
    const voted = DB.votes.some(v=>v.event_id===eventId && v.member_id===m.id);
    if(!voted){
      await addNotification(m.id, `Reminder: please RSVP for ${dateLabel} before ${new Date(ev.deadline).toLocaleString()}.`);
      sendPush(m.id, `Reminder: please RSVP for ${dateLabel}.`);
      count++;
    }
  }
  return {count};
}
async function broadcastMessage(text){
  const { error } = await sb.from('messages').insert({ from_id: null, to_id: null, text, is_broadcast: true, sender_label:'Admin' });
  if(error) return {error:error.message};
  for(const m of DB.members) await addNotification(m.id, `[Admin] ${text}`);
  sendPush('ALL', `[Admin] ${text}`);
  return {ok:true, count: DB.members.length};
}
async function markNotifsRead(memberId){
  await sb.from('notifications').update({read:true}).eq('member_id', memberId).eq('read', false);
}
async function heartbeat(){
  if(session && session.memberId!=='ADMIN'){
    await sb.from('members').update({last_seen: new Date().toISOString()}).eq('id', session.memberId);
  }
}

/* ================= Realtime ================= */
function setupRealtime(){
  sb.channel('public:all-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'messages'}, async ()=>{ await refreshQuiet(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'notifications'}, async ()=>{ await refreshQuiet(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'votes'}, async ()=>{ await refreshQuiet(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'events'}, async ()=>{ await refreshQuiet(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'members'}, async ()=>{ await refreshQuiet(); })
    .subscribe();
}
async function refreshQuiet(){
  try{ await loadAll(); render(); }catch(e){ console.error(e); }
}

/* ================= Boot / render root ================= */
async function boot(){
  session = loadSession();
  render();
  try{
    await loadAll();
    // Clear stale sessions left over from the old Google Sheets backend (short IDs, not real UUIDs)
    if(session && session.role!=='admin' && !DB.members.some(m=>m.id===session.memberId)){
      session = null; clearSession();
    }
    render();
    setupRealtime();
    if(session) registerPushForMember(session.memberId);
    if(heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(heartbeat, 60000);
  }catch(e){
    const main = document.getElementById('main');
    if(main) main.insertAdjacentHTML('afterbegin', `
      <div class="card" style="border:1px solid #E8703A;">
        <b style="color:#8E2A2A;">Couldn't reach the backend</b>
        <p class="muted">${escapeHtml(e.message)}</p>
        <button class="btn-primary" onclick="boot()">Retry</button>
      </div>`);
  }
}
function registerPushForMember(memberId){
  window.__pendingExternalId = memberId;
  OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.login(memberId);
    if (OneSignal.Notifications.permission !== true) await OneSignal.Notifications.requestPermission();
  });
}
function enableNotifications(){
  OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.Notifications.requestPermission();
    alert(OneSignal.Notifications.permission === true ? 'Notifications enabled!' : 'Notifications are still blocked. Check your browser/site settings.');
  });
}

function unreadMessageCount(){
  if(!session || session.role==='admin') return 0;
  return DB.messages.filter(m=>!m.is_broadcast && m.to_id===session.memberId && !m.read_at).length;
}
function unreadAnnouncementCount(){
  if(!session) return 0;
  const lastSeen = localStorage.getItem('ann_seen_'+session.memberId) || '1970-01-01';
  return DB.messages.filter(m=>m.is_broadcast && new Date(m.sent_at) > new Date(lastSeen)).length;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="topbar">
      <div>
        <div style="background:#fff;border-radius:10px;padding:4px 10px;display:inline-block;">
          <img src="logo-transparent.png" alt="Saifee's Calendar" style="height:32px;display:block;">
        </div>
        <div class="who">${session ? escapeHtml(session.name)+' · '+session.role : 'Not logged in'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        ${session && session.role!=='admin' ? bellHtml() : ''}
        ${session ? `<a class="link" style="color:#fff;" onclick="doLogout()">Logout</a>` : ''}
      </div>
    </header>
    <main id="main"></main>
    ${session ? tabbarHtml() : ''}
  `;
  if(!session){ renderAuth(); return; }
  if(notifOpen){ renderNotifPanel(); return; }
  if(activeTab==='calendar') renderCalendar();
  else if(activeTab==='vote') renderVote();
  else if(activeTab==='presence') renderPresence();
  else if(activeTab==='messages') renderMessages();
  else if(activeTab==='admin') renderAdmin();
}
function bellHtml(){
  const list = DB.notifications.filter(n=>n.member_id===session.memberId);
  const unread = list.filter(n=>!n.read).length;
  return `<div class="bell" onclick="toggleNotif()">🔔${unread?`<span class="dot">${unread}</span>`:''}</div>`;
}
async function toggleNotif(){
  notifOpen = !notifOpen;
  if(notifOpen){ await markNotifsRead(session.memberId); await loadAll(); }
  render();
}
function renderNotifPanel(){
  const main = document.getElementById('main');
  const list = DB.notifications.filter(n=>n.member_id===session.memberId).sort((a,b)=>new Date(b.at)-new Date(a.at));
  main.innerHTML = `<div class="card"><h2>Notifications</h2>
    <a class="link" onclick="toggleNotif()">&larr; Back</a><div style="height:8px;"></div>
    ${list.length? list.map(n=>`<div class="notif-item">${escapeHtml(n.text)}<div class="muted">${new Date(n.at).toLocaleString()}</div></div>`).join('') : '<div class="muted">No notifications yet.</div>'}
  </div>`;
}
function tabbarHtml(){
  const msgBadge = unreadMessageCount() + unreadAnnouncementCount();
  const tabs = [
    {id:'calendar', icon:'📅', label:'Calendar'},
    {id:'vote', icon:'✅', label:'Vote'},
    {id:'presence', icon:'👥', label:'Presence'},
    {id:'messages', icon:'💬', label:'Messages', badge: msgBadge},
  ];
  if(session.role==='admin') tabs.push({id:'admin', icon:'⚙️', label:'Admin'});

/* ================= CALENDAR ================= */
function renderCalendar(){
  const main = document.getElementById('main');
  const now = new Date();
  if(hijriViewY === null){
    const h0 = gregorianToHijri(now.getFullYear(), now.getMonth()+1, now.getDate());
    hijriViewY = h0.hy; hijriViewM = h0.hm;
  }
  const monthLabel = `${HIJRI_MONTHS[hijriViewM-1].toUpperCase()} - ${hijriViewY}`;
  const monthStart = findHijriMonthStart(hijriViewY, hijriViewM);

  let length = 0;
  let walker = new Date(monthStart);
  while(true){
    const h = gregorianToHijri(walker.getFullYear(), walker.getMonth()+1, walker.getDate());
    if(h.hy===hijriViewY && h.hm===hijriViewM){ length++; walker.setDate(walker.getDate()+1); }
    else break;
  }
  const firstDow = monthStart.getDay();
  const cells = [];
  for(let i=firstDow;i>=1;i--){ const dt=new Date(monthStart); dt.setDate(dt.getDate()-i); cells.push({date:dt,grey:true}); }
  for(let d=0; d<length; d++){ const dt=new Date(monthStart); dt.setDate(dt.getDate()+d); cells.push({date:dt,grey:false}); }
  const rem = cells.length % 7;
  if(rem!==0){ const extra=7-rem; for(let i=0;i<extra;i++){ const dt=new Date(monthStart); dt.setDate(dt.getDate()+length+i); cells.push({date:dt,grey:true}); } }

  let cellsHtml = cells.map(c=>{
    const date = c.date;
    const h = gregorianToHijri(date.getFullYear(), date.getMonth()+1, date.getDate());
    const key = ymdKey(date);
    const isToday = ymdKey(now)===key;
    const isPast = date < new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const ev = DB.events.find(e=>e.g_date && ymdKey(new Date(e.g_date))===key);
    let cls = 'calday';
    if(isToday) cls+=' today'; else if(ev) cls+=' event'; else if(isPast && !c.grey) cls+=' past';
    if(c.grey) cls+=' greyday';
    const gLabel = date.getDate()===1 ? `${date.getDate()} ${date.toLocaleString('en',{month:'short'})}` : `${date.getDate()}`;
    return `<div class="${cls}" ${ev?`onclick="openEventDetail('${ev.id}')"`:''} style="${ev?'cursor:pointer':''}">
      <div class="h">${toArabicNum(h.hd)}</div>
      <div class="g">${gLabel}</div>
      ${ev?'<div class="dot"></div>':''}
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:8px;">
        <button class="btn-secondary btn-small" onclick="hijriViewM--;if(hijriViewM<1){hijriViewM=12;hijriViewY--;}render()">&larr; Prev</button>
        <button class="btn-secondary btn-small" onclick="hijriViewY=null;render()">Today</button>
        <button class="btn-secondary btn-small" onclick="hijriViewM++;if(hijriViewM>12){hijriViewM=1;hijriViewY++;}render()">Next &rarr;</button>
      </div>
      <div class="calhead">${monthLabel}<div style="font-size:19px;margin-top:4px;font-family:'FatemiQanz','Segoe UI',sans-serif;" dir="rtl">${HIJRI_MONTHS_AR[hijriViewM-1]}</div></div>
      <div class="calgrid">
        ${['S','M','T','W','T','F','S'].map(d=>`<div class="caldow">${d}</div>`).join('')}
        ${cellsHtml}
      </div>
      <div class="muted" style="margin-top:10px;">Tap a highlighted date to see totals. Orange dot = meal event scheduled. Greyed dates belong to the adjacent Hijri month.</div>
    </div>
    <div id="eventDetail"></div>
    ${session.role!=='admin' ? `
    <div class="card">
      <h2>My reminders</h2>
      <div id="reminderList" class="muted">Loading…</div>
      <input id="reminderText" placeholder="Reminder text">
      <input id="reminderWhen" type="datetime-local">
      <button class="btn-primary" onclick="addReminder()">Add reminder</button>
    </div>` : ''}
  `;
  if(session.role!=='admin') loadReminders();
}
async function loadReminders(){
  const { data, error } = await sb.from('reminders').select('*').eq('member_id', session.memberId).order('remind_at', {ascending:true});
  const list = document.getElementById('reminderList');
  if(!list) return;
  if(error){ list.innerHTML = `<span class="muted">Couldn't load reminders.</span>`; return; }
  list.innerHTML = data.length ? data.map(r=>`
    <div class="memberrow">
      <span>${escapeHtml(r.text)}<br><span class="muted">${new Date(r.remind_at).toLocaleString()}${r.notified?' · sent':''}</span></span>
      <button class="btn-secondary btn-small" onclick="deleteReminder('${r.id}')">Remove</button>
    </div>`).join('') : '<div class="muted">No reminders yet.</div>';
}
async function addReminder(){
  const text = document.getElementById('reminderText').value.trim();
  const when = document.getElementById('reminderWhen').value;
  if(!text || !when) return alert('Enter text and a date/time.');
  const { error } = await sb.from('reminders').insert({ member_id: session.memberId, text, remind_at: new Date(when).toISOString() });
  if(error) return alert(error.message);
  document.getElementById('reminderText').value='';
  document.getElementById('reminderWhen').value='';
  loadReminders();
}
async function deleteReminder(id){
  await sb.from('reminders').delete().eq('id', id);
  loadReminders();
}
function openEventDetail(eventId){
  const ev = DB.events.find(e=>e.id===eventId);
  const votes = DB.votes.filter(v=>v.event_id===eventId);
  const count = (meal,resp)=>votes.filter(v=>v.meal===meal && v.response===resp).length;
  document.getElementById('eventDetail').innerHTML = `
    <div class="card">
      <h2>${new Date(ev.g_date).toDateString()} — ${ev.status==='closed'?'Closed':'Open'} (deadline ${new Date(ev.deadline).toLocaleString()})</h2>
      <div class="row">
        <div><b>Lunch</b><br><span class="tag tag-yes">Yes ${count('Lunch','Yes')}</span> <span class="tag tag-no">No ${count('Lunch','No')}</span></div>
        <div><b>Dinner</b><br><span class="tag tag-yes">Yes ${count('Dinner','Yes')}</span> <span class="tag tag-no">No ${count('Dinner','No')}</span></div>
      </div>
      ${session.role==='admin' ? adminFamilyBreakdown(eventId) : ''}
    </div>`;
}
function adminFamilyBreakdown(eventId){
  const rows = DB.families.map(f=>{
    const ids = membersOfFamily(f.id).map(m=>m.id);
    const v = DB.votes.filter(x=>x.event_id===eventId && ids.includes(x.member_id));
    const yes = v.filter(x=>x.response==='Yes').length, no = v.filter(x=>x.response==='No').length;
    return `<div class="memberrow"><span>${escapeHtml(f.name)}</span><span class="muted">Yes ${yes} / No ${no}</span></div>`;
  }).join('');
  return `<div style="margin-top:10px;"><b class="muted">By family</b>${rows}</div>`;
}

    <div class="card">
      <h2>My family members</h2>
      ${myFamilyMembers.map(m=>`<div class="memberrow"><span>${escapeHtml(m.name)}${m.is_head?' <span class="muted">(head)</span>':''}</span></div>`).join('')}
      <div class="row" style="margin-top:8px;">
        <input id="newMemberName" placeholder="Add family member name">
        <input id="newMemberPass" type="password" placeholder="Their password (optional)">
      </div>
      <button class="btn-secondary" onclick="doAddMember()">+ Add member</button>
    </div>
    <div class="card">
      <h2>Open events</h2>
      ${openEvents.length? openEvents.map(e=>`
        <div class="memberrow">
          <span>${new Date(e.g_date).toDateString()}<br><span class="muted">Deadline: ${new Date(e.deadline).toLocaleString()}</span></span>
          <button class="btn-primary btn-small" onclick="openVoteGrid('${e.id}')">Vote</button>

async function doAddMember(){
  const name = document.getElementById('newMemberName').value.trim();
  const pass = document.getElementById('newMemberPass').value.trim();
  if(!name) return alert('Enter a name.');
  const res = await addMember(session.familyId, name, pass);
  if(res.error) return alert(res.error);
  await loadAll();
  renderVote();
}
function openVoteGrid(eventId){
  const fam = membersOfFamily(session.familyId);
  const rows = fam.map(m=>{
    const lv = DB.votes.find(v=>v.event_id===eventId && v.member_id===m.id && v.meal==='Lunch');
    const dv = DB.votes.find(v=>v.event_id===eventId && v.member_id===m.id && v.meal==='Dinner');
    return `<div class="memberrow">
      <span>${escapeHtml(m.name)}</span>
      <span class="row" style="gap:4px;">
        <button class="pill ${lv&&lv.response==='Yes'?'on':''}" onclick="castVote('${eventId}','${m.id}','Lunch','Yes')">L:Yes</button>
        <button class="pill ${lv&&lv.response==='No'?'off':''}" onclick="castVote('${eventId}','${m.id}','Lunch','No')">L:No</button>
        <button class="pill ${dv&&dv.response==='Yes'?'on':''}" onclick="castVote('${eventId}','${m.id}','Dinner','Yes')">D:Yes</button>
        <button class="pill ${dv&&dv.response==='No'?'off':''}" onclick="castVote('${eventId}','${m.id}','Dinner','No')">D:No</button>
      </span>
    </div>`;
  }).join('');
  document.getElementById('voteGrid').innerHTML = `<div class="card"><h2>${new Date(DB.events.find(e=>e.id===eventId).g_date).toDateString()}</h2>${rows}</div>`;
}
async function castVote(eventId, memberId, meal, response){
  const ev = DB.events.find(e=>e.id===eventId);
  if(new Date(ev.deadline) <= new Date() || ev.status==='closed'){ alert('Voting is closed for this date.'); return; }
  const res = await castVoteRow(eventId, memberId, meal, response, session.memberId);
  if(res.error) return alert(res.error);
  await loadAll();
  openVoteGrid(eventId);
}

/* ================= PRESENCE ================= */
function renderPresence(){
  const main = document.getElementById('main');
  const latestEvent = [...DB.events].sort((a,b)=>new Date(b.g_date)-new Date(a.g_date))[0];
  const rows = DB.members.map(m=>{
    const online = m.last_seen && (new Date() - new Date(m.last_seen)) < 2*60*1000;
    let votedTxt = '—';
    if(latestEvent){
      const voted = DB.votes.some(v=>v.event_id===latestEvent.id && v.member_id===m.id);
      votedTxt = voted ? 'Voted' : 'Not voted yet';
    }
    return `<div class="memberrow">
      <span>${escapeHtml(m.name)}<br><span class="muted">${famName(m.family_id)}</span></span>
      <span style="text-align:right;">
        <div class="pill ${online?'on':''}" style="display:inline-block;">${online?'Online':'Offline'}</div>
        <div class="muted">${online?'':'Last seen '+(m.last_seen? new Date(m.last_seen).toLocaleString():'never')}</div>
        <div class="muted">${votedTxt}</div>
      </span>
    </div>`;
  }).join('');
  main.innerHTML = `<div class="card"><h2>Family members</h2>${rows||'<div class="muted">No members yet.</div>'}</div>`;
}

/* ================= MESSAGES ================= */
function renderMessages(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="row" style="margin-bottom:10px;">
      <a class="link" onclick="enableNotifications()">🔔 Enable notifications</a>
    </div>
    <div class="subtabs">
      <button class="btn-secondary ${msgSubTab==='chats'?'active':''}" onclick="msgSubTab='chats';msgWith=null;render()">Chats</button>
      <button class="btn-secondary ${msgSubTab==='announcements'?'active':''}" onclick="openAnnouncements()">Announcements ${unreadAnnouncementCount()?`<span class="unreadbadge">${unreadAnnouncementCount()}</span>`:''}</button>
    </div>
    <div id="msgBody"></div>
  `;
  if(msgSubTab==='chats') renderChatsSubtab();
  else renderAnnouncementsSubtab();
}
function openAnnouncements(){
  msgSubTab = 'announcements';
  if(session) localStorage.setItem('ann_seen_'+session.memberId, new Date().toISOString());
  render();
}
function renderAnnouncementsSubtab(){
  const list = DB.messages.filter(m=>m.is_broadcast).sort((a,b)=>new Date(b.sent_at)-new Date(a.sent_at));
  document.getElementById('msgBody').innerHTML = `
    <div class="card">
      <h2>Announcements</h2>
      ${list.length? list.map(m=>`
        <div class="notif-item"><b>${escapeHtml(m.sender_label||'Admin')}</b>: ${escapeHtml(m.text)}
          <div class="muted">${new Date(m.sent_at).toLocaleString()}</div>
        </div>`).join('') : '<div class="muted">No announcements yet.</div>'}
    </div>`;
}
function renderChatsSubtab(){
  const others = DB.members.filter(m=>m.id!==session.memberId);
  const convos = others.map(m=>{
    const thread = DB.messages.filter(x=>!x.is_broadcast &&
      ((x.from_id===session.memberId && x.to_id===m.id) || (x.from_id===m.id && x.to_id===session.memberId)));
    const last = thread.sort((a,b)=>new Date(b.sent_at)-new Date(a.sent_at))[0];
    const unread = thread.filter(x=>x.to_id===session.memberId && !x.read_at).length;
    return { member:m, last, unread };
  }).sort((a,b)=>{
    if(!a.last && !b.last) return 0;
    if(!a.last) return 1;
    if(!b.last) return -1;
    return new Date(b.last.sent_at) - new Date(a.last.sent_at);
  });
  const body = document.getElementById('msgBody');
  body.innerHTML = `
    <div class="card">
      <h2>Chats</h2>
      ${convos.map(c=>`
        <div class="convo" onclick="openChat('${c.member.id}')">
          <span>${escapeHtml(c.member.name)} <span class="muted">(${famName(c.member.family_id)})</span>
            <div class="preview">${c.last? escapeHtml(c.last.text) : 'No messages yet'}</div>
          </span>
          ${c.unread? `<span class="unreadbadge">${c.unread}</span>` : ''}
        </div>`).join('') || '<div class="muted">No other members yet.</div>'}
    </div>
    <div id="chatBox"></div>
  `;
  if(msgWith) openChat(msgWith);
}
async function openChat(memberId){
  msgWith = memberId;
  const other = findMember(memberId);
  await markMessagesRead(memberId, session.memberId);
  await loadAll();
  const thread = DB.messages.filter(m => !m.is_broadcast &&
    ((m.from_id===session.memberId && m.to_id===memberId) || (m.from_id===memberId && m.to_id===session.memberId))
  ).sort((a,b)=>new Date(a.sent_at)-new Date(b.sent_at));
  const chatBox = document.getElementById('chatBox');
  if(!chatBox) { renderChatsSubtab(); return; }
  chatBox.innerHTML = `
    <div class="card">
      <h2>Chat with ${escapeHtml(other.name)}</h2>
      <div style="max-height:260px;overflow-y:auto;margin-bottom:10px;">
        ${thread.map(m=>{
          const mine = m.from_id===session.memberId;
          const bubble = `<div class="msgline ${mine?'msg-me':'msg-them'}">${escapeHtml(m.text)}</div>`;
          const seen = mine ? `<div class="seen">${m.read_at ? 'Seen at '+new Date(m.read_at).toLocaleTimeString() : 'Sent'}</div>` : '';
          return bubble + seen;
        }).join('') || '<div class="muted">No messages yet.</div>'}
      </div>
      <input id="chatInput" placeholder="Type a message...">
      <button class="btn-primary" onclick="sendMsg('${memberId}')">Send</button>
    </div>`;
  renderTabBadgeOnly();
}
function renderTabBadgeOnly(){
  const bar = document.querySelector('.tabbar');
  if(bar) bar.outerHTML = tabbarHtml();
}
async function sendMsg(memberId){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const res = await sendChatMessage(session.memberId, memberId, text);
  if(res.error) return alert(res.error);
  await loadAll();
  openChat(memberId);
}

async function sendReminders(eventId){

}
async function editMemberPrompt(memberId){

  if(newName===null || !newName.trim()) return;
  const res = await editMemberName(memberId, newName.trim());
  if(res.error) return alert(res.error);
  await loadAll(); renderAdmin();
}
async function sendBroadcast(){
  const text = document.getElementById('broadcastText').value.trim();

  const res = await broadcastMessage(text);
