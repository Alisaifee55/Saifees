function gregorianToHijri(gy, gm, gd){
  let jd = Math.floor((1461*(gy + 4800 + Math.floor((gm-14)/12)))/4) +
           Math.floor((367*(gm-2-12*Math.floor((gm-14)/12)))/12) -
           Math.floor((3*Math.floor((gy+4900+Math.floor((gm-14)/12))/100))/4) +
           gd - 32075;
  let l = jd - 1948440 + 10632;
  let n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  let j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  let hm = Math.floor((24*l)/709);
  let hd = l - Math.floor((709*hm)/24);
  let hy = 30*n + j - 30;
  return {hy, hm, hd};
}

const ARABIC_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicNum(n){ return String(n).split('').map(c=>ARABIC_DIGITS[+c]||c).join(''); }
function ymdKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function findHijriMonthStart(hy, hm){
  let guess = hijriToGregorian(hy, hm, 1);
  for(let attempts=0; attempts<8; attempts++){
    const h = gregorianToHijri(guess.getFullYear(), guess.getMonth()+1, guess.getDate());
    if(h.hy===hy && h.hm===hm && h.hd===1) break;
    if(h.hy===hy && h.hm===hm){ guess.setDate(guess.getDate() + (1 - h.hd)); }
    else { const before = (h.hy<hy) || (h.hy===hy && h.hm<hm); guess.setDate(guess.getDate() + (before ? 1 : -1)); }
  }
  return guess;
}

    sb.from('votes').select('*'),
    sb.from('messages').select('*').order('sent_at', {ascending:true}),
    sb.from('notifications').select('*').order('at', {ascending:false}),
    sb.from('households').select('*'),
  ]);
  if(fam.error) throw fam.error;

    votes: vt.data||[], messages: ms.data||[], notifications: nt.data||[],

  };

    const { data } = await sb.from('reminders').select('*').eq('member_id', session.memberId).order('remind_at', {ascending:true});

  }
  try{ localStorage.setItem('saifees_db_cache', JSON.stringify(DB)); }catch(e){}
}
function loadCachedDB(){
  try{ const c = localStorage.getItem('saifees_db_cache'); if(c) DB = JSON.parse(c); }catch(e){}
}
function nameTaken(name, exceptId){
  return DB.members.some(m => m.name.toLowerCase()===name.toLowerCase() && m.id!==exceptId);
}
function membersOfFamily(familyId){ return DB.members.filter(m=>m.family_id===familyId); }
function membersOfHousehold(householdId){ return DB.members.filter(m=>m.household_id===householdId); }
function myHousehold(){ return DB.households.find(h=>h.id===session.household_id) || null; }
function myHouseholdMembers(){
  if(!session) return [];

  const me = DB.members.find(m=>m.id===session.memberId);
  if(!me || !me.household_id) return [me].filter(Boolean);

function hhName(id){ return (DB.households.find(h=>h.id===id)||{}).name||''; }
function findMember(id){ return DB.members.find(m=>m.id===id); }
function famName(id){ return (DB.families.find(f=>f.id===id)||{}).name || ''; }

async function addNotification(memberId, text){
  await sb.from('notifications').insert({member_id: memberId, text});
}
async function sendPush(target, message, additionalData={}){
  try{
    // Build payload: merge url + additionalData so notification click deep-links
    const launchUrl = window.location.origin + window.location.pathname + buildDeepLink(additionalData);
    if(target === 'ALL'){
      await sb.functions.invoke('send-push', { body: { target: 'ALL', message, additionalData, url: launchUrl } });
      return;
    }
    const member = findMember(target);
    const body = { message, additionalData, url: launchUrl };
    if(member && member.onesignal_subscription_id){
      await sb.functions.invoke('send-push', { body: { subscriptionIds: [member.onesignal_subscription_id], ...body } });
    } else {
      await sb.functions.invoke('send-push', { body: { target, ...body } });
    }
  }catch(e){ console.error('push failed', e); }
}
// Build a query-string deep link from additionalData
function buildDeepLink(data={}){
  if(!data.type) return '';
  const p = new URLSearchParams({deeplink: data.type});
  if(data.fromId) p.set('from', data.fromId);
  if(data.eventId) p.set('event', data.eventId);
  return '?' + p.toString();
}

async function registerFamily(name, headName, password){
  if(DB.families.some(f=>f.name.toLowerCase()===name.toLowerCase())) return {error:'Family name already taken.'};
  if(nameTaken(headName)) return {error:'That member name is already used. Please add a surname/initial.'};
  const { data: fam, error: e1 } = await sb.from('families').insert({name, password}).select().single();
  if(e1) return {error:e1.message};
  const { data: mem, error: e2 } = await sb.from('members').insert({
    family_id: fam.id, name: headName, password, is_head: true, last_seen: new Date().toISOString()
  }).select().single();
  if(e2) return {error:e2.message};
  return { familyId: fam.id, memberId: mem.id, name: mem.name, role: 'head' };
}
async function loginUser(username, password){
  // PRIMARY: match by username field (clean, unique, no ambiguity)
  const byUsername = DB.members.find(m => m.username && m.username.toLowerCase()===username.toLowerCase() && String(m.password)===String(password));
  if(byUsername){
    await sb.from('members').update({last_seen: new Date().toISOString()}).eq('id', byUsername.id);
    const role = byUsername.id === SUPERADMIN_ID ? 'superadmin' : (byUsername.role || 'member');
    return { familyId: byUsername.family_id, memberId: byUsername.id, name: byUsername.name, username: byUsername.username, role, household_id: byUsername.household_id||null };
  }
  // FALLBACK: match by first name (for existing members without username set yet)
  const firstName = username.trim().split(' ')[0].toLowerCase();
  const byFirstName = DB.members.find(m => m.name.toLowerCase().startsWith(firstName) && String(m.password)===String(password));
  if(byFirstName){
    await sb.from('members').update({last_seen: new Date().toISOString()}).eq('id', byFirstName.id);
    const role = byFirstName.id === SUPERADMIN_ID ? 'superadmin' : (byFirstName.role || 'member');
    return { familyId: byFirstName.family_id, memberId: byFirstName.id, name: byFirstName.name, username: byFirstName.username||firstName, role, household_id: byFirstName.household_id||null };
  }
  return {error:'Username or password is incorrect.'};
}
async function addMember(familyId, name, password){
  if(nameTaken(name)) return {error:'That name is already used by someone else.'};
  const { data, error } = await sb.from('members').insert({family_id: familyId, name, password, is_head:false}).select().single();
  if(error) return {error:error.message};
  return {id:data.id, name:data.name};
}
async function editMemberName(memberId, newName){
  if(nameTaken(newName, memberId)) return {error:'That name is already used by someone else.'};
  const { error } = await sb.from('members').update({name:newName}).eq('id', memberId);
  if(error) return {error:error.message};
  return {ok:true};
}
async function createEventRow(gDate, deadline){
  const { error } = await sb.from('events').insert({g_date: gDate, deadline, status:'open'});
  if(error) return {error:error.message};
  return {ok:true};
}
async function toggleEventRow(eventId){
  const ev = DB.events.find(e=>e.id===eventId);
  const { error } = await sb.from('events').update({status: ev.status==='closed'?'open':'closed'}).eq('id', eventId);
  if(error) return {error:error.message};

}
async function castVoteRow(eventId, memberId, meal, response, submittedBy){
  const { error } = await sb.from('votes').upsert({
    event_id: eventId, member_id: memberId, meal, response, submitted_by: submittedBy, updated_at: new Date().toISOString()
  }, { onConflict: 'event_id,member_id,meal' });
  if(error) return {error:error.message};
  const ev = DB.events.find(e=>e.id===eventId);
  const dateLabel = ev ? new Date(ev.g_date).toDateString() : '';
  await addNotification(memberId, `Your ${meal} RSVP for ${dateLabel} was set to ${response}.`);
  sendPush(memberId, `Your ${meal} RSVP for ${dateLabel} was set to ${response}.`);
  return {ok:true};
}
async function sendChatMessage(fromId, toId, text){
  const { error } = await sb.from('messages').insert({from_id: fromId, to_id: toId, text});
  if(error) return {error:error.message};
  const sender = findMember(fromId);
  await addNotification(toId, `New message from ${sender?sender.name:'someone'}: "${text}"`);
  const pushText = (text||"").replace(/<[^>]*>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").trim().slice(0,80);
  sendPush(toId, (sender?sender.name:"Someone") + ": " + (pushText||"New message"), {type:'chat', fromId});
  return {ok:true};
}
async function markMessagesRead(fromId, toId){
  await sb.from('messages').update({read_at: new Date().toISOString()})
    .eq('from_id', fromId).eq('to_id', toId).is('read_at', null);
}
async function sendReminderRow(eventId){
  const ev = DB.events.find(e=>e.id===eventId);
  const dateLabel = ev ? new Date(ev.g_date).toDateString() : '';
  let count = 0;
  for(const m of DB.members){
    const voted = DB.votes.some(v=>v.event_id===eventId && v.member_id===m.id);
    if(!voted){
      await addNotification(m.id, `Reminder: please RSVP for ${dateLabel} before ${new Date(ev.deadline).toLocaleString()}.`);
      sendPush(m.id, `Reminder: please RSVP for ${dateLabel}.`, {type:'vote', eventId});
      count++;
    }
  }
  return {count};
}
async function broadcastMessage(text){
  const { error } = await sb.from('messages').insert({ from_id: null, to_id: null, text, is_broadcast: true, sender_label:'Admin' });
  if(error) return {error:error.message};
  for(const m of DB.members) await addNotification(m.id, `[Admin] ${text}`);
  sendPush('ALL', `[Admin] ${text}`, {type:'announcements'});
  return {ok:true, count: DB.members.length};
}
async function markNotifsRead(memberId){
  await sb.from('notifications').update({read:true}).eq('member_id', memberId).eq('read', false);
}
async function heartbeat(){

/* ============================================================
   DEEP LINK ROUTING — notification click opens correct tab
   ============================================================ */
function handleDeepLinkOnLoad(){
  if(!session) return;
  const params = new URLSearchParams(window.location.search);
  const type = params.get('deeplink');
  if(!type) return;
  // Clean URL so back/refresh don't re-trigger
  history.replaceState({}, '', window.location.pathname);
  routeDeepLink(type, {
    fromId: params.get('from') || null,
    eventId: params.get('event') || null
  });
}
function routeDeepLink(type, data={}){
  if(!session) return;
  if(type === 'chat'){
    // Open Messages tab → Chats sub-tab → open the specific conversation
    activeTab = 'messages';
    notifOpen = false;
    msgSubTab = 'chats';
    render();
    if(data.fromId){
      // Small delay so the chat list is rendered before we try to open the modal
      setTimeout(()=> openChat(data.fromId), 120);
    }
  } else if(type === 'vote'){
    // Open Vote tab (and optionally scroll to the event)
    activeTab = 'vote';
    notifOpen = false;
    render();
    if(data.eventId){
      setTimeout(()=>{
        // Try to click the Vote button for that event if it exists
        const btn = document.querySelector(`[onclick*="openVoteGrid('${data.eventId}')"]`);
        if(btn) btn.click();
      }, 150);
    }
  } else if(type === 'announcements'){
    activeTab = 'messages';
    notifOpen = false;
    msgSubTab = 'announcements';
    render();
  } else if(type === 'calendar'){
    activeTab = 'calendar';
    notifOpen = false;
    render();
  }
}
function setupOneSignalClickHandler(){
  // OneSignal foreground notification click handler
  // Fires when user taps a notification while the app is open (or when SW routes back)
  OneSignalDeferred.push(function(OneSignal){
    try{
      OneSignal.Notifications.addEventListener('click', function(e){
        const data = e && e.notification && e.notification.additionalData ? e.notification.additionalData : {};
        if(data.type) routeDeepLink(data.type, data);
      });
    }catch(err){ /* OneSignal not ready */ }
  });
}

/* ================= Boot / render root ================= */
async function boot(){
  session = loadSession();
  loadCachedDB(); // paint instantly with whatever we saw last time, no waiting on the network
  render();
  attachAppSwipe();
  try{
    await loadAll(); // now sync the real data quietly in the background
    if(session && session.role!=='admin' && !DB.members.some(m=>m.id===session.memberId)){
      session = null; clearSession();
    }
    // Refresh role from DB (role may have changed since last login)
    if(session && session.memberId){
      const freshMember = DB.members.find(m => m.id === session.memberId);
      if(freshMember && freshMember.role){
        session.role = freshMember.role;
        session.household_id = freshMember.household_id || null;
        saveSession();
      }
    }
    render();
    setupRealtime();
    if(session) registerPushForMember(session.memberId);
    // Handle deep link from notification click (URL param OR OneSignal foreground click)
    handleDeepLinkOnLoad();
    setupOneSignalClickHandler();
    if(heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(heartbeat, 60000);
  }catch(e){
    console.error('background sync failed', e);
    const main = document.getElementById('main');
    if(main) main.insertAdjacentHTML('afterbegin', `
      <div class="card" style="border:1px solid #E8703A;">
        <b style="color:#8E2A2A;">Couldn't sync latest data</b> — showing what was last loaded.
        <p class="muted">${escapeHtml(e.message)}</p>
        <button class="btn-secondary btn-small" onclick="boot()">Retry</button>
      </div>`);
  }
}
function registerPushForMember(memberId){
  window.__pendingExternalId = memberId;
  OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.login(memberId);
    if (OneSignal.Notifications.permission !== true) await OneSignal.Notifications.requestPermission();
    await saveSubscriptionId(memberId);
  });
}
async function saveSubscriptionId(memberId){
  try{
    const subId = window.OneSignal && OneSignal.User && OneSignal.User.PushSubscription ? OneSignal.User.PushSubscription.id : null;
    if(subId){
      await sb.from('members').update({onesignal_subscription_id: subId}).eq('id', memberId);
    }
  }catch(e){ console.error('could not save subscription id', e); }
}
async function enableNotifications(){
  try{
    if(!window.OneSignal || !OneSignal.Notifications){
      alert('The notification system hasn\'t finished loading yet.\n\nWait a few seconds and tap again. If this keeps happening every time, something on this network/browser (like a content or ad blocker) may be blocking cdn.onesignal.com from loading at all.');
      return;
    }
    const before = OneSignal.Notifications.permission;
    const result = await OneSignal.Notifications.requestPermission();
    const after = OneSignal.Notifications.permission;
    if(session && session.memberId!=='ADMIN') await saveSubscriptionId(session.memberId);
    render();
    alert('Permission before: ' + before + '\nrequestPermission() result: ' + result + '\nPermission after: ' + after);
  }catch(err){
    alert('Error requesting permission: ' + (err && err.message ? err.message : String(err)));
  }
}

function unreadMessageCount(){

function unreadAnnouncementCount(){
  if(!session) return 0;
  const lastSeen = localStorage.getItem('ann_seen_'+session.memberId) || '1970-01-01';
  return DB.messages.filter(m=>m.is_broadcast && new Date(m.sent_at) > new Date(lastSeen)).length;

async function doLogin(){
  const username = document.getElementById('loginName').value.trim();
  const password = document.getElementById('loginPass').value;
  if(!username || !password){ showChatToast('Enter username and password.'); return; }
  const res = await loginUser(username, password);
  if(res.error){ showChatToast('❌ ' + res.error); return; }
  session = {role:res.role, familyId:res.familyId, memberId:res.memberId, name:res.name, username:res.username, household_id:res.household_id||null};
  saveSession();
  registerPushForMember(res.memberId);
  await loadAll();
  render();
}
async function doRegisterMember(){
  const fullName  = (document.getElementById('regFullName')?.value||'').trim();
  const username  = (document.getElementById('regUsername')?.value||'').trim().toLowerCase().replace(/\s+/g,'');
  const password  = (document.getElementById('regPass')?.value||'');
  const famPass   = (document.getElementById('regFamilyPass')?.value||'');
  if(!fullName||!username||!password||!famPass){ showChatToast('Please fill all fields.'); return; }
  if(!/^[a-z0-9_]+$/.test(username)){ showChatToast('Username: letters, numbers, _ only.'); return; }
  // Verify family password
  const fam = DB.families.find(f => String(f.password)===String(famPass));
  if(!fam){ showChatToast('❌ Wrong family password.'); return; }
  // Check username unique
  if(DB.members.some(m => m.username && m.username.toLowerCase()===username)){ showChatToast('❌ Username already taken.'); return; }
  // Check full name unique
  if(DB.members.some(m => m.name.toLowerCase()===fullName.toLowerCase())){ showChatToast('❌ Full name already registered.'); return; }
  const { data, error } = await sb.from('members').insert({
    family_id: fam.id, name: fullName, username, password: String(password), is_head: false, role: 'member'
  }).select().single();
  if(error){ showChatToast('❌ ' + error.message); return; }
  showChatToast('✅ Account created! Logging you in...');
  await loadAll();
  session = {role:'member', familyId:fam.id, memberId:data.id, name:fullName, username};
  saveSession();
  registerPushForMember(data.id);
  render();
}

function renderCalendar(){
  const main = document.getElementById('main');
  const now = new Date();
  if(hijriViewY === null){
    const h0 = gregorianToHijri(now.getFullYear(), now.getMonth()+1, now.getDate());
    hijriViewY = h0.hy; hijriViewM = h0.hm;
  }
  const monthStart = findHijriMonthStart(hijriViewY, hijriViewM);

  let length = 0;
  let walker = new Date(monthStart);
  while(true){
    const h = gregorianToHijri(walker.getFullYear(), walker.getMonth()+1, walker.getDate());
    if(h.hy===hijriViewY && h.hm===hijriViewM){ length++; walker.setDate(walker.getDate()+1); }
    else break;
  }
  const firstDow = monthStart.getDay();
  const cells = [];
  for(let i=firstDow;i>=1;i--){ const dt=new Date(monthStart); dt.setDate(dt.getDate()-i); cells.push({date:dt,grey:true}); }
  for(let d=0; d<length; d++){ const dt=new Date(monthStart); dt.setDate(dt.getDate()+d); cells.push({date:dt,grey:false,hijriStart:d===0}); }
  const rem = cells.length % 7;
  if(rem!==0){ const extra=7-rem; for(let i=0;i<extra;i++){ const dt=new Date(monthStart); dt.setDate(dt.getDate()+length+i); cells.push({date:dt,grey:true}); } }

  let cellsHtml = cells.map(c=>{
    const date = c.date;
    const h = gregorianToHijri(date.getFullYear(), date.getMonth()+1, date.getDate());
    const key = ymdKey(date);
    const isToday = ymdKey(now)===key;
    const isPast = date < new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const ev = DB.events.find(e=>e.g_date && ymdKey(new Date(e.g_date))===key);
    const hasReminder = DB.reminders.some(r=>ymdKey(new Date(r.remind_at))===key);
    let cls = 'calday';
    if(isToday) cls+=' today'; else if(ev) cls+=' event'; else if(isPast && !c.grey) cls+=' past';
    if(c.grey) cls+=' greyday';
    const showMonth = date.getDate()===1 || c.hijriStart;
    const gLabel = showMonth ? `${date.getDate()} ${date.toLocaleString('en',{month:'short'})}` : `${date.getDate()}`;
    return `<div class="${cls}" onclick="handleDateTap('${key}', event)" style="cursor:pointer;">
      <div class="h">${toArabicNum(h.hd)}</div>
      <div class="g">${gLabel}</div>
      <div class="dot-row">
        ${ev?'<div class="dot event-dot"></div>':''}
        ${hasReminder?'<div class="dot reminder-dot"></div>':''}
      </div>
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:8px;">
        <button class="btn-secondary btn-small" onclick="shiftMonth(-1)">&larr; Prev</button>
        <button class="btn-secondary btn-small" onclick="shiftMonth(0)">Today</button>
        <button class="btn-secondary btn-small" onclick="shiftMonth(1)">Next &rarr;</button>
      </div>
      ${session.role!=='admin'&&session.role!=='superadmin' ? `<div class="row" style="margin-bottom:8px;"><a class="link" onclick="openAllReminders()">📋 My reminders</a></div>` : ''}
      <div class="calhead">
        ${monthCallig(hijriViewM)}
        <div class="sub" style="font-family:'FatemiQanz','Segoe UI',sans-serif;">${hijriViewY}</div>
      </div>
      <div class="calgrid-wrap" id="calGridWrap">
        <div class="calgrid">
          ${['S','M','T','W','T','F','S'].map(d=>`<div class="caldow">${d}</div>`).join('')}
          ${cellsHtml}
        </div>
      </div>
      <div class="muted" style="margin-top:10px;">Tap a date to preview it, tap again to open and edit. Swipe left/right to change month. 🟠 pulsing dot = meal event · 🟢 dot = your reminder.</div>
    </div>
  `;
  attachCalendarSwipe();
  // Auto-scroll: ensure calendar grid is visible, not tabs
  window.scrollTo({top:0, behavior:'instant'});
}

// Page-turn sound via Web Audio API (no external file needed)
function playPageTurnSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.18, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++){
      // White noise with fast exponential decay — sounds like paper rustle
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 2.5) * 0.35;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    // Band-pass filter to make it crispier like paper
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 2800;
    filter.Q.value = 0.7;
    src.connect(filter);
    filter.connect(ctx.destination);
    src.start();
    src.stop(ctx.currentTime + 0.18);
  }catch(e){ /* AudioContext not available */ }
}

function shiftMonth(delta){
  closeDayPopover();
  if(delta === 0){
    hijriViewY = null;
    render();
    return;
  }
  // Animate out existing grid
  const wrap = document.getElementById('calGridWrap');
  if(wrap){
    const outClass = delta > 0 ? 'cal-page-out-next' : 'cal-page-out-prev';
    wrap.classList.add(outClass);
    playPageTurnSound();
    setTimeout(()=>{
      hijriViewM += delta;
      if(hijriViewM < 1){ hijriViewM = 12; hijriViewY--; }
      else if(hijriViewM > 12){ hijriViewM = 1; hijriViewY++; }
      render();
      // Animate in new grid
      const newWrap = document.getElementById('calGridWrap');
      if(newWrap){
        const inClass = delta > 0 ? 'cal-page-in-next' : 'cal-page-in-prev';
        newWrap.classList.add(inClass);
      }
    }, 200);
  } else {
    hijriViewM += delta;
    if(hijriViewM < 1){ hijriViewM = 12; hijriViewY--; }
    else if(hijriViewM > 12){ hijriViewM = 1; hijriViewY++; }
    render();
  }
}
function attachCalendarSwipe(){
  const wrap = document.getElementById('calGridWrap');
  if(!wrap || wrap.dataset.swipeBound) return;
  wrap.dataset.swipeBound = '1';
  let sx=0, sy=0, tracking=false;
  wrap.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true; }, {passive:true});
  wrap.addEventListener('touchend', e=>{
    if(!tracking) return; tracking=false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){
      shiftMonth(dx < 0 ? 1 : -1);
    }
  }, {passive:true});
}
function attachAppSwipe(){
  const app = document.getElementById('app');
  if(!app || app.dataset.swipeBound) return;
  app.dataset.swipeBound = '1';
  let sx=0, sy=0, tracking=false;
  app.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true; }, {passive:true});
  app.addEventListener('touchend', e=>{
    if(!tracking) return; tracking=false;
    if(!session || activeTab==='calendar') return; // calendar handles its own swipe (month nav)
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if(dx < -55 && Math.abs(dx) > Math.abs(dy)*1.4){
      setTab('calendar');
    }
  }, {passive:true});
}

async function saveReminderForDate(dateKey){
  const text = document.getElementById('reminderText').value.trim();
  const time = document.getElementById('reminderTime').value || '09:00';
  const repeat = selectedRepeat;
  if(!text) return alert('Enter reminder text.');
  const [y,m,d] = dateKey.split('-').map(Number);
  const [hh,mm] = time.split(':').map(Number);
  const remindAt = new Date(y, m-1, d, hh, mm).toISOString();

  let error;
  if(editingReminderId){
    ({ error } = await sb.from('reminders').update({ text, remind_at: remindAt, repeat, notified: false }).eq('id', editingReminderId));
  } else {
    ({ error } = await sb.from('reminders').insert({ member_id: session.memberId, text, remind_at: remindAt, repeat }));
  }
  if(error) return alert(error.message);
  editingReminderId = null;
  await loadAll();
  renderCalendar();
  openDayDetail(dateKey);
}

function isOnline(member){
  if(!member || !member.last_seen) return false;
  return (new Date() - new Date(member.last_seen)) < 3 * 60 * 1000; // online if seen within 3 min
}
function formatLastSeen(member){
  if(!member.last_seen) return 'Never seen';
  if(isOnline(member)) return 'Online now';
  const d = new Date(member.last_seen);
  const now = new Date();
  const diffMin = Math.floor((now - d) / 60000);
  if(diffMin < 60) return diffMin + 'm ago';
  if(diffMin < 1440) return Math.floor(diffMin/60) + 'h ago';
  return d.toLocaleDateString([], {day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
function avatarInitial(name){ return (name||'?')[0].toUpperCase(); }

let chatSearchQ = '';
function renderChatsSubtab(){
  const others = DB.members.filter(m=>m.id!==session.memberId);
  const convos = others.map(function(m){
    const thread = DB.messages.filter(function(x){ return !x.is_broadcast &&
      ((x.from_id===session.memberId && x.to_id===m.id)||(x.from_id===m.id && x.to_id===session.memberId)); });
    const last = thread.sort(function(a,b){ return new Date(b.sent_at)-new Date(a.sent_at); })[0];
    const unread = thread.filter(function(x){ return x.to_id===session.memberId && !x.read_at; }).length;
    const online = isOnline(m);
    return { member:m, last:last||null, unread, online };
  }).sort(function(a,b){
    // Messages first, sorted by most recent message
    const aHas=!!a.last, bHas=!!b.last;
    if(aHas && !bHas) return -1;
    if(!aHas && bHas) return 1;
    if(aHas && bHas) return new Date(b.last.sent_at)-new Date(a.last.sent_at);
    // No messages: online first then last_seen
    if(a.online && !b.online) return -1;
    if(!a.online && b.online) return 1;
    return (new Date(b.member.last_seen||0))-(new Date(a.member.last_seen||0));
  });

  const body = document.getElementById('msgBody');
  if(!body) return;

  const rows = convos.map(function(c){
    const m=c.member, online=c.online;
    const lastSeenStr = formatLastSeen(m);
    const preview = c.last ? plainTextPreview(c.last.text).slice(0,50) : 'No messages yet';
    const lastTime = c.last ? formatMsgTime(c.last.sent_at) : '';
    const initial = avatarInitial(m.name);
    const searchKey = (m.name+' '+(m.username||'')).toLowerCase();
    return '<div class="convo" data-mid="'+m.id+'" data-search="'+searchKey+'" onclick="openChat(this.dataset.mid)">'
      +'<div class="convo-avatar">'+initial+'<span class="presence-badge '+(online?'online':'offline')+'"></span></div>'
      +'<div class="convo-info">'
      +'<div class="convo-name">'+escapeHtml(m.name)
      +(m.username?'<span class="muted" style="font-size:10px;font-weight:400;margin-left:4px;">@'+escapeHtml(m.username)+'</span>':'')
      +'</div>'
      +'<div class="convo-preview">'+escapeHtml(preview)+'</div>'
      +'<div style="font-size:10px;color:'+(online?'#2ecc71':'var(--muted)')+';margin-top:1px;">'
      +(online?'● Online now':'● '+lastSeenStr)+'</div>'
      +'</div>'
      +'<div class="convo-meta">'
      +(c.unread?'<span class="unreadbadge">'+c.unread+'</span>':'')
      +'<div class="convo-time">'+lastTime+'</div>'
      +'</div></div>';
  }).join('')||'<div class="muted" style="padding:16px 0;">No other members yet.</div>';

  body.innerHTML = '<div class="card">'
    +'<div class="msg-search-wrap"><span class="msg-search-icon">🔍</span>'
    +'<input id="chatSearchInput" type="search" placeholder="Search by name or username…" style="width:100%;padding-left:32px;" oninput="filterChatList(this.value)">'
    +'</div>'
    +'<div id="convoList">'+rows+'</div>'
    +'</div>';
}
function filterChatList(q){
  const term=(q||'').toLowerCase().trim();
  const rows=document.querySelectorAll('#convoList .convo');
  let any=false;
  rows.forEach(function(row){
    const match=!term||(row.dataset.search||'').includes(term);
    row.style.display=match?'':'none';
    if(match) any=true;
  });
  let nr=document.getElementById('convoNoResult');
  if(!any && term){
    if(!nr){ nr=document.createElement('div'); nr.id='convoNoResult'; nr.className='muted'; nr.style.padding='12px 0'; document.getElementById('convoList').appendChild(nr); }
    nr.textContent='No results for "'+q+'"';
  } else if(nr){ nr.remove(); }
}
function formatMsgTime(ts){
  if(!ts) return '';
  const d=new Date(ts), now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const diff=Math.floor((now-d)/86400000);
  if(diff===1) return 'Yesterday';
  if(diff<7) return d.toLocaleDateString([],{weekday:'short'});
  return d.toLocaleDateString([],{day:'numeric',month:'short'});
}

    bubbles += '<div class="chat-bubble-row ' + (mine?'me':'them') + '">'
      + '<div class="chat-bubble ' + (mine?'me':'them') + '">' + sanitizeRichText(m.text) + '</div>'
      + '<div class="chat-bubble-time">' + timeStr + (mine?'<span style="color:' + (m.read_at?'var(--teal)':'#aaa') + ';">' + seenTick + '</span>':'') + '</div>'
      + '</div>';
  });

  // Remove old screen if any

    + '<div class="chat-header-info">'
    + '<div class="chat-header-name">' + escapeHtml(other.name) + '</div>'
    + '<div class="chat-header-status" style="color:' + (online?'#a8f0c6':'rgba(255,255,255,.75)') + ';">' + statusStr + '</div>'
    + '</div>'
    + '</div>'
    + '<div class="chat-fmt-bar">'
    + '<button type="button" class="fmt-btn" onmousedown="event.preventDefault();document.execCommand(&quot;bold&quot;)"><b>B</b></button>'
    + '<button type="button" class="fmt-btn" onmousedown="event.preventDefault();document.execCommand(&quot;italic&quot;)"><i>I</i></button>'
    + ['#2B2620','#E8703A','#127A79','#8E2A2A','#3B6FD4'].map(function(c){
        return '<button type="button" class="fmt-swatch" style="background:' + c + ';" data-color="' + c + '" onmousedown="event.preventDefault();applyColor(this.dataset.color)"></button>';
      }).join('')
    + '</div>'
    + '<div class="chat-messages" id="chatMsgArea">' + bubbles + '</div>'
    + '<div class="chat-compose-bar">'
    + '<div id="chatInput" class="chat-compose-input compose-editable" contenteditable="true" data-placeholder="Message\u2026"></div>'
    + '<button class="chat-send-circle chat-send-btn">&#10148;</button>'
    + '</div>';

  document.body.appendChild(scr);
  // Wire keydown and send button with correct memberId (avoids quote issues in HTML string)

function attachChatScreenSwipe(scr){
  let sx=0, sy=0, tracking=false;
  scr.addEventListener('touchstart', function(e){ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true; }, {passive:true});
  scr.addEventListener('touchend', function(e){
    if(!tracking) return; tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    // Swipe RIGHT to go back (WhatsApp gesture)
    if(dx > 60 && Math.abs(dx)>Math.abs(dy)*1.4) closeChatScreen();
  }, {passive:true});
}

function handleComposeKeydown(e, memberId){

function sanitizeRichText(html){
  const allowed = ['B','STRONG','I','EM','U','BR','SPAN','DIV'];
  const div = document.createElement('div');
  div.innerHTML = html;
  (function clean(node){
    [...node.childNodes].forEach(child=>{
      if(child.nodeType===1){
        if(!allowed.includes(child.tagName)){
          child.replaceWith(document.createTextNode(child.textContent));
          return;
        }
        [...child.attributes].forEach(attr=>{
          if((child.tagName==='SPAN'||child.tagName==='DIV') && attr.name==='style'){
            // Keep only color and background-color — strip everything else
            const colorM = attr.value.match(/(?:^|;)\s*(color:\s*[^;]+)/);
            const bgM    = attr.value.match(/(?:^|;)\s*(background-color:\s*[^;]+)/);
            const kept = [colorM?colorM[1].trim():'', bgM?bgM[1].trim():''].filter(Boolean).join(';');
            if(kept) child.setAttribute('style', kept); else child.removeAttribute('style');
          } else {
            child.removeAttribute(attr.name);
          }
        });
        clean(child);
      } else if(child.nodeType!==3){
        child.remove();
      }
    });
  })(div);
  return div.innerHTML;
}
function plainTextPreview(html){
  const div = document.createElement('div');
  div.innerHTML = html;
  return (div.textContent || '').trim();
}
function renderTabBadgeOnly(){
  const bar = document.querySelector('.tabbar');
  if(bar) bar.outerHTML = tabbarHtml();
}
async function sendMsg(memberId){
  if(window._msgSending) return; // mutex: block re-entry while sending
  const input = document.getElementById('chatInput');
  if(!input) return;
  const html = sanitizeRichText(input.innerHTML).trim();
  const plain = plainTextPreview(html);
  if(!plain) return;

  // Lock UI immediately (WhatsApp feel: instant feedback)
  window._msgSending = true;
  const sendBtn = document.querySelector('.chat-send-btn');
  if(sendBtn){ sendBtn.disabled = true; sendBtn.textContent = '...'; }
  input.contentEditable = 'false';

  // Optimistic bubble: show message instantly before server confirms
  const msgArea = document.getElementById('chatMsgArea');
  const tempId = 'tmp_' + Date.now();
  if(msgArea){
    const emptyHint = msgArea.querySelector('.empty-hint');
    if(emptyHint) emptyHint.remove();
    const tmpBubble = document.createElement('div');
    tmpBubble.id = tempId;
    tmpBubble.innerHTML = `<div class="msgline msg-me" style="opacity:.65">${html}</div><div class="seen" style="opacity:.5">Sending…</div>`;
    msgArea.appendChild(tmpBubble);
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  // Clear input right away (WhatsApp clears before server response)
  input.innerHTML = '';

  // Send to server
  const res = await sendChatMessage(session.memberId, memberId, html);

  // Remove optimistic bubble
  const tmpEl = document.getElementById(tempId);
  if(tmpEl) tmpEl.remove();

  // Unlock
  window._msgSending = false;
  input.contentEditable = 'true';
  if(sendBtn){ sendBtn.disabled = false; sendBtn.textContent = 'Send'; }

  if(res && res.error){
    // Put message back so user doesn't lose it
    input.innerHTML = html;
    showChatToast('❌ Failed to send. Try again.');
    return;
  }

  // Refresh only the message bubbles (no full page rebuild)
  await loadAll();
  refreshChatThread(memberId);
  renderTabBadgeOnly();
  input.focus();
}

// Refresh only the message bubbles inside an already-open chat
function refreshChatThread(memberId){
  if(document.getElementById('chatScreen')) renderChatScreen(memberId);
}

// Toast notification (WhatsApp-style error feedback)
function showChatToast(msg, duration=3000){
  let t = document.getElementById('_appToast');
  if(!t){
    t = document.createElement('div');
    t.id = '_appToast';
    t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>{ t.style.opacity='0'; }, duration);
}

   SUPER ADMIN PANEL — ADS Only (Ali Asgar Saifee)
   ============================================================ */
function renderSuperAdmin(){
  const main = document.getElementById('main');
  if(!main) return;
  if(session.memberId !== SUPERADMIN_ID){ main.innerHTML='<div class="card"><p>Access denied.</p></div>'; return; }

  const roleColor = {superadmin:'var(--orange)', admin:'var(--teal)', member:'var(--muted)'};
  const roleName  = {superadmin:'Super Admin', admin:'Admin', member:'Member'};

  let memberRows = '';
  DB.members.forEach(function(m){
    const isADS = m.id === SUPERADMIN_ID;
    const role = m.id === SUPERADMIN_ID ? 'superadmin' : (m.role || 'member');
    const badgeStyle = 'background:' + (role==='superadmin'?'var(--orange)':role==='admin'?'var(--teal)':'#eee') + ';color:' + (role==='member'?'var(--muted)':'#fff') + ';font-size:10px;';
    const badge = '<span class="tag" style="' + badgeStyle + '">' + roleName[role] + '</span>';
    let btn = '';
    if(!isADS && role==='admin'){
      btn = '<button class="pill off btn-small" data-mid="' + m.id + '" data-mn="' + escapeHtml(m.name) + '" onclick="revokeAdmin(this.dataset.mid,this.dataset.mn)">Revoke</button>';
    } else if(!isADS){
      btn = '<button class="pill on btn-small" data-mid="' + m.id + '" data-mn="' + escapeHtml(m.name) + '" onclick="grantAdmin(this.dataset.mid,this.dataset.mn)">Make Admin</button>';
    }
    memberRows += '<div class="memberrow"><div><div style="font-weight:700;font-size:14px;">' + escapeHtml(m.name) + '</div><div style="margin-top:3px;">' + badge + '</div></div>' + btn + '</div>';
  });

  let memberTable = '';
  DB.members.forEach(function(m){
    const role = m.id === SUPERADMIN_ID ? 'superadmin' : (m.role || 'member');
    const lastSeen = m.last_seen ? new Date(m.last_seen).toLocaleDateString() : 'Never';
    const username = m.username || ('(' + m.name.split(' ')[0].toLowerCase() + ')');
    const delBtn = m.id === SUPERADMIN_ID ? '' : '<button class="btn-secondary btn-small" data-mid="' + m.id + '" data-mn="' + escapeHtml(m.name) + '" onclick="adsDeleteMember(this.dataset.mid,this.dataset.mn)" style="margin-right:4px;">Remove</button>';
    const resetBtn = '<button class="btn-secondary btn-small" data-mid="' + m.id + '" data-mn="' + escapeHtml(m.name) + '" onclick="adsResetPassword(this.dataset.mid,this.dataset.mn)">Reset PIN</button>';
    const setUserBtn = m.username ? '' : '<button class="btn-secondary btn-small" data-mid="' + m.id + '" data-mn="' + escapeHtml(m.name) + '" onclick="adsSetUsername(this.dataset.mid,this.dataset.mn)" style="margin-right:4px;">Set User</button>';
    memberTable += '<tr style="border-bottom:1px solid #f1ebe1;">'
      + '<td style="padding:8px 4px;"><div style="font-weight:600;font-size:13px;">' + escapeHtml(m.name) + '</div><div style="font-size:10px;color:var(--muted);">@' + username + '</div></td>'
      + '<td style="padding:8px 4px;font-size:11px;color:' + (roleColor[role]||'var(--muted)') + ';font-weight:700;">' + role.toUpperCase() + '</td>'
      + '<td style="padding:8px 4px;font-size:11px;color:var(--muted);">' + lastSeen + '</td>'
      + '<td style="padding:8px 4px;white-space:nowrap;">' + setUserBtn + resetBtn + delBtn + '</td></tr>';
  });

  const memberOptions = DB.members
    .filter(function(m){ return m.id !== SUPERADMIN_ID; })
    .map(function(m){ return '<option value="' + m.id + '">' + escapeHtml(m.name) + '</option>'; })
    .join('');

  main.innerHTML =
    '<div class="card"><h2 style="color:var(--orange-dark);">👑 ADS Control Panel</h2>'
    + '<p class="muted" style="margin-bottom:0;">Admin rights, member management, conversation viewer.</p></div>'

    + '<div class="card" style="margin-top:0;">'
    + '<div class="section-label">➕ Add New Member</div>'
    + '<div class="row"><input id="adsNewName" placeholder="Full name (e.g. Zainab Saifee)" style="margin-bottom:0;">'
    + '<input id="adsNewUsername" placeholder="Username (e.g. zainab)" autocapitalize="off" style="margin-bottom:0;"></div>'
    + '<input id="adsNewPass" type="password" placeholder="PIN / Password">'
    + '<button class="btn-primary" onclick="adsAddMember()">Add Member</button>'
    + '<div class="section-label" style="margin-top:16px;">📋 Bulk Add (FullName,username,PIN — one per line)</div>'
    + '<textarea id="adsBulkInput" placeholder="Zainab Saifee,zainab,1234\nHusain Saifee,husain,5678" style="width:100%;height:80px;padding:10px;border-radius:10px;border:1px solid #E5DDD2;font-size:13px;font-family:inherit;resize:vertical;margin-bottom:8px;"></textarea>'
    + '<button class="btn-secondary" onclick="adsBulkAdd()">Bulk Add Members</button>'
    + '<div id="adsBulkResult" style="margin-top:8px;font-size:12px;color:var(--teal-dark);"></div></div>'

    + '<div class="card" style="margin-top:0;">'
    + '<div class="section-label">👥 All Members (' + DB.members.length + ')</div>'
    + '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;">'
    + '<thead><tr style="border-bottom:2px solid #e5ddd2;">'
    + '<th style="text-align:left;padding:6px 4px;font-size:11px;color:var(--muted);">NAME</th>'
    + '<th style="text-align:left;padding:6px 4px;font-size:11px;color:var(--muted);">ROLE</th>'
    + '<th style="text-align:left;padding:6px 4px;font-size:11px;color:var(--muted);">LAST SEEN</th>'
    + '<th style="padding:6px 4px;"></th></tr></thead>'
    + '<tbody>' + memberTable + '</tbody></table></div></div>'

    + '<div class="card" style="margin-top:0;">'
    + '<div class="section-label">🏠 Households</div>'
    + '<div id="hhManageArea">' + buildHouseholdManageHTML() + '</div>'
    + '</div>'
    + '<div class="card" style="margin-top:0;">'
    + '<div class="section-label">🔑 Admin Rights</div>' + memberRows + '</div>'

    + '<div class="card" style="margin-top:0;">'
    + '<div class="section-label">👁 View Any Conversation (read-only)</div>'
    + '<div class="row" style="margin-bottom:10px;">'
    + '<select id="adsViewA" onchange="adsLoadThread()" style="margin-bottom:0;"><option value="">— Member A —</option>' + memberOptions + '</select>'
    + '<select id="adsViewB" onchange="adsLoadThread()" style="margin-bottom:0;"><option value="">— Member B —</option>' + memberOptions + '</select>'
    + '</div>'
    + '<div id="adsThreadArea" style="max-height:45vh;overflow-y:auto;background:#fdfaf5;border-radius:12px;padding:10px;">'
    + '<div class="empty-hint">Select two members to view their conversation.</div>'
    + '</div></div>';
}

function buildHouseholdManageHTML(){
  let html = '';

  // Create new household form
  const memberOpts = DB.members.map(function(m){
    return '<option value="' + m.id + '">' + escapeHtml(m.name) + '</option>';
  }).join('');

  html += '<div style="margin-bottom:14px;">'
    + '<div class="row" style="margin-bottom:8px;">'
    + '<input id="hhNewName" placeholder="Household name (e.g. Ali Household)" style="margin-bottom:0;">'
    + '<select id="hhNewHead" style="margin-bottom:0;"><option value="">— Head (optional) —</option>' + memberOpts + '</select>'
    + '</div>'
    + '<button class="btn-primary btn-small" onclick="adsCreateHousehold()">Create Household</button>'
    + '</div>';

  if(!DB.households || !DB.households.length){
    html += '<div class="empty-hint">No households yet. Create one above.</div>';
    return html;
  }

  // Each household card
  DB.households.forEach(function(hh){
    const head = DB.members.find(function(m){ return m.id === hh.head_id; });
    const members = DB.members.filter(function(m){ return m.household_id === hh.id; });

    // Member assign dropdowns — show unassigned members
    const unassigned = DB.members.filter(function(m){ return !m.household_id; });
    const assignOpts = unassigned.map(function(m){
      return '<option value="' + m.id + '">' + escapeHtml(m.name) + '</option>';
    }).join('');

    html += '<div style="background:#fdfaf5;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #e5ddd2;">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
      + '<div>'
      + '<div style="font-weight:700;font-size:14px;">🏠 ' + escapeHtml(hh.name) + '</div>'
      + (head ? '<div style="font-size:11px;color:var(--muted);">Head: ' + escapeHtml(head.name) + '</div>' : '')
      + '</div>'
      + '<button class="btn-secondary btn-small" style="color:#e74c3c;" data-hhid="' + hh.id + '" data-hhname="' + escapeHtml(hh.name) + '" onclick="adsDeleteHousehold(this.dataset.hhid,this.dataset.hhname)">Delete</button>'
      + '</div>';

    // Current members list
    if(members.length){
      html += '<div style="margin-bottom:8px;">';
      members.forEach(function(m){
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f0ebe2;">'
          + '<span style="font-size:13px;">' + escapeHtml(m.name) + '</span>'
          + '<button class="btn-secondary btn-small" data-mid="' + m.id + '" data-mn="' + escapeHtml(m.name) + '" onclick="adsUnassignMember(this.dataset.mid,this.dataset.mn)">Remove</button>'
          + '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="muted" style="font-size:12px;margin-bottom:8px;">No members yet.</div>';
    }

    // Add member to this household
    if(unassigned.length){
      html += '<div class="row" style="margin-top:6px;">'
        + '<select id="hhAssign_' + hh.id + '" style="margin-bottom:0;"><option value="">— Add member —</option>' + assignOpts + '</select>'
        + '<button class="btn-secondary btn-small" data-hhid="' + hh.id + '" onclick="adsAssignMember(this.dataset.hhid)">Add</button>'
        + '</div>';
    }

    html += '</div>';
  });

  // Show unassigned members
  const unassigned2 = DB.members.filter(function(m){ return !m.household_id; });
  if(unassigned2.length){
    html += '<div style="margin-top:10px;padding:10px;background:#fff8f0;border-radius:10px;border:1px solid #f0ddc0;">'
      + '<div style="font-size:12px;font-weight:700;color:var(--orange-dark);margin-bottom:6px;">⚠️ Unassigned Members</div>'
      + unassigned2.map(function(m){ return '<div style="font-size:12px;color:var(--muted);padding:2px 0;">' + escapeHtml(m.name) + '</div>'; }).join('')
      + '</div>';
  }

  return html;
}

async function adsCreateHousehold(){
  const name = (document.getElementById('hhNewName')?.value||'').trim();
  const headId = document.getElementById('hhNewHead')?.value || null;
  if(!name){ showChatToast('Enter a household name.'); return; }
  if(DB.households.some(function(h){ return h.name.toLowerCase()===name.toLowerCase(); })){
    showChatToast('Household name already exists.'); return;
  }
  const { error } = await sb.from('households').insert({ name, head_id: headId||null });
  if(error){ showChatToast('Error: ' + error.message); return; }
  await loadAll();
  showChatToast('✅ Household "' + name + '" created!');
  renderSuperAdmin();
}

async function adsAssignMember(householdId){
  const sel = document.getElementById('hhAssign_' + householdId);
  const memberId = sel ? sel.value : '';
  if(!memberId){ showChatToast('Select a member to add.'); return; }
  const m = DB.members.find(function(x){ return x.id===memberId; });
  const { error } = await sb.from('members').update({ household_id: householdId }).eq('id', memberId);
  if(error){ showChatToast('Error: ' + error.message); return; }
  await loadAll();
  showChatToast('✅ ' + (m?m.name:'Member') + ' added to household.');
  renderSuperAdmin();
}

async function adsUnassignMember(memberId, name){
  if(!confirm('Remove ' + name + ' from their household?')) return;
  const { error } = await sb.from('members').update({ household_id: null }).eq('id', memberId);
  if(error){ showChatToast('Error: ' + error.message); return; }
  await loadAll();
  showChatToast(name + ' removed from household.');
  renderSuperAdmin();
}

async function adsDeleteHousehold(hhId, name){
  if(!confirm('Delete household "' + name + '"? Members will be unassigned.')) return;
  // Unassign all members first
  await sb.from('members').update({ household_id: null }).eq('household_id', hhId);
  const { error } = await sb.from('households').delete().eq('id', hhId);
  if(error){ showChatToast('Error: ' + error.message); return; }
  await loadAll();
  showChatToast('✅ Household deleted.');
  renderSuperAdmin();
}

async function adsAddMember(){
  const name     = document.getElementById('adsNewName').value.trim();
  const username = (document.getElementById('adsNewUsername')?.value||'').trim().toLowerCase().replace(/\s+/g,'');
  const pass     = document.getElementById('adsNewPass').value.trim();
  if(!name || !username || !pass){ showChatToast('Enter full name, username and PIN.'); return; }
  if(!/^[a-z0-9_]+$/.test(username)){ showChatToast('Username: letters, numbers, _ only.'); return; }
  if(DB.members.some(m=>m.name.toLowerCase()===name.toLowerCase())){ showChatToast('Full name already exists.'); return; }
  if(DB.members.some(m=>m.username&&m.username.toLowerCase()===username)){ showChatToast('Username already taken.'); return; }
  const familyId = DB.families[0]?.id;
  if(!familyId){ showChatToast('No family found.'); return; }
  const { data, error } = await sb.from('members').insert({family_id:familyId, name, username, password:String(pass), is_head:false, role:'member'}).select().single();
  if(error){ showChatToast('Error: ' + error.message); return; }
  document.getElementById('adsNewName').value = '';
  document.getElementById('adsNewUsername').value = '';
  document.getElementById('adsNewPass').value = '';
  await loadAll();
  showChatToast('✅ ' + name + ' (' + username + ') added!');
  renderSuperAdmin();
}

async function adsBulkAdd(){
  const lines = document.getElementById('adsBulkInput').value.trim().split('\n').filter(l=>l.trim());
  if(!lines.length){ showChatToast('Enter at least one line.'); return; }
  const familyId = DB.families[0]?.id;
  if(!familyId){ showChatToast('No family found.'); return; }
  const resultDiv = document.getElementById('adsBulkResult');
  resultDiv.textContent = 'Adding...';
  let added = 0, skipped = [];
  for(const line of lines){
    const parts = line.split(',');
    if(parts.length < 3){ skipped.push(line.trim() + ' (need: FullName,username,PIN)'); continue; }
    const name = parts[0].trim();
    const username = parts[1].trim().toLowerCase().replace(/\s+/g,'');
    const pass = parts.slice(2).join(',').trim();
    if(!name || !username || !pass){ skipped.push(line.trim() + ' (empty field)'); continue; }
    if(DB.members.some(m=>m.name.toLowerCase()===name.toLowerCase())){ skipped.push(name + ' (name exists)'); continue; }
    if(DB.members.some(m=>m.username&&m.username.toLowerCase()===username)){ skipped.push(username + ' (username taken)'); continue; }
    const { error } = await sb.from('members').insert({family_id:familyId, name, username, password:String(pass), is_head:false, role:'member'});
    if(error){ skipped.push(name + ' (error: ' + error.message + ')'); } else { added++; }
  }
  await loadAll();
  let msg = added + ' member(s) added.';
  if(skipped.length) msg += ' Skipped: ' + skipped.join(', ');
  resultDiv.textContent = msg;
  if(added > 0){
    document.getElementById('adsBulkInput').value = '';
    renderSuperAdmin();
    document.getElementById('adsBulkResult').textContent = msg;
  }
}

async function adsResetPassword(memberId, name){
  const newPass = prompt('New PIN / password for ' + name + ':');
  if(!newPass || !newPass.trim()){ return; }
  const { error } = await sb.from('members').update({ password: String(newPass.trim()) }).eq('id', memberId);
  if(error){ showChatToast('Error: ' + error.message); return; }
  showChatToast('✅ Password reset for ' + name);
}
async function adsSetUsername(memberId, name){
  const u = prompt('Set username for ' + name + ' (letters/numbers/_ only):');
  if(!u || !u.trim()) return;
  const username = u.trim().toLowerCase().replace(/\s+/g,'');
  if(!/^[a-z0-9_]+$/.test(username)){ showChatToast('Invalid username format.'); return; }
  if(DB.members.some(m=>m.id!==memberId && m.username && m.username.toLowerCase()===username)){ showChatToast('Username already taken.'); return; }
  const { error } = await sb.from('members').update({ username }).eq('id', memberId);
  if(error){ showChatToast('Error: ' + error.message); return; }
  await loadAll();
  showChatToast('✅ Username set: @' + username + ' for ' + name);
  renderSuperAdmin();
}
async function adsDeleteMember(memberId, name){
  if(memberId === SUPERADMIN_ID){ showChatToast('Cannot remove Super Admin.'); return; }
  if(!confirm('Remove ' + name + '? This cannot be undone.')) return;
  const { error } = await sb.from('members').delete().eq('id', memberId);
  if(error){ showChatToast('Error: ' + error.message); return; }
  await loadAll();
  showChatToast(name + ' removed.');
  renderSuperAdmin();
}


async function grantAdmin(memberId, name){
  if(!confirm(`Make ${name} an Admin?\nThey will be able to create events, send reminders, and broadcast messages.`)) return;
  const { error } = await sb.from('members').update({ role: 'admin' }).eq('id', memberId);
  if(error){ showChatToast('❌ Error: ' + error.message); return; }
  await loadAll();
  showChatToast(`✅ ${name} is now an Admin`);
  renderSuperAdmin();
}

async function revokeAdmin(memberId, name){
  if(!confirm(`Remove Admin rights from ${name}?`)) return;
  const { error } = await sb.from('members').update({ role: 'member' }).eq('id', memberId);
  if(error){ showChatToast('❌ Error: ' + error.message); return; }
  await loadAll();
  showChatToast(`✅ ${name} is now a regular Member`);
  renderSuperAdmin();
}

function adsLoadThread(){
  const aId = document.getElementById('adsViewA')?.value;
  const bId = document.getElementById('adsViewB')?.value;
  const area = document.getElementById('adsThreadArea');
  if(!area) return;
  if(!aId || !bId || aId === bId){
    area.innerHTML = '<div class="empty-hint">Select two different members.</div>';
    return;
  }
  const thread = DB.messages.filter(m =>
    !m.is_broadcast &&
    ((m.from_id === aId && m.to_id === bId) || (m.from_id === bId && m.to_id === aId))
  ).sort((a,b) => new Date(a.sent_at) - new Date(b.sent_at));

  if(!thread.length){
    area.innerHTML = '<div class="empty-hint">No messages between these two members.</div>';
    return;
  }
  area.innerHTML = thread.map(m => {
    const fromName = escapeHtml(findMember(m.from_id)?.name || 'Unknown');
    const time = new Date(m.sent_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const date = new Date(m.sent_at).toLocaleDateString();
    const isA = m.from_id === aId;
    const align = isA ? 'text-align:left' : 'text-align:right';
    const cls = isA ? 'msg-them' : 'msg-me';
    const ml = isA ? '' : 'margin-left:auto';
    return '<div style="margin-bottom:10px;">'
      + '<div style="font-size:10px;color:var(--muted);margin-bottom:2px;' + align + '">' + fromName + ' · ' + date + ' ' + time + '</div>'
      + '<div class="msgline ' + cls + '" style="max-width:80%;' + ml + '">' + sanitizeRichText(m.text) + '</div>'
      + '</div>';
  }).join('');
  area.scrollTop = area.scrollHeight;
}

/* ================= ADMIN ================= */
function renderAdmin(){
  const main = document.getElementById('main');
  if(session.role!=='admin'&&session.role!=='superadmin'){ main.innerHTML='<div class="card"><p>Access denied.</p></div>'; return; }
  main.innerHTML = `
    <div class="card">
      <h2>Create meal event</h2>
      <input id="evDate" type="date">
      <input id="evDeadline" type="datetime-local">
      <button class="btn-primary" onclick="createEvent()">Create event</button>
    </div>
    <div class="card">
      <h2>All events</h2>
      ${DB.events.length? DB.events.map(e=>`
        <div class="memberrow">
          <span>${new Date(e.g_date).toDateString()}<br><span class="muted">Deadline ${new Date(e.deadline).toLocaleString()} · ${e.status==='closed'?'Closed':'Open'}</span></span>
          <span>
            <button class="btn-secondary btn-small" onclick="toggleEventStatus('${e.id}')">${e.status==='closed'?'Reopen':'Close'}</button>
            <button class="btn-secondary btn-small" onclick="sendReminders('${e.id}')">Remind</button>
          </span>
        </div>`).join('') : '<div class="muted">No events yet.</div>'}
    </div>
    <div class="card">
      <h2>Edit member details</h2>
      ${DB.members.map(m=>`
        <div class="memberrow">
          <span>${escapeHtml(m.name)} <span class="muted">(${famName(m.family_id)})</span></span>
          <button class="btn-secondary btn-small" onclick="editMemberPrompt('${m.id}')">Edit</button>
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>Broadcast announcement to everyone</h2>
      <input id="broadcastText" placeholder="Message to all members">
      <button class="btn-primary" onclick="sendBroadcast()">Send to all</button>
    </div>
  `;
}
async function createEvent(){
  const d = document.getElementById('evDate').value;
  const dl = document.getElementById('evDeadline').value;
  if(!d || !dl) return alert('Pick a date and deadline.');
  const res = await createEventRow(d, dl);
  if(res.error) return alert(res.error);
  await loadAll(); renderAdmin();
}
async function toggleEventStatus(eventId){
  const res = await toggleEventRow(eventId);
  if(res.error) return alert(res.error);
  await loadAll(); renderAdmin();
}
async function sendReminders(eventId){
  const res = await sendReminderRow(eventId);
  alert(`Reminder sent to ${res.count} member(s) who haven't voted.`);
  await loadAll();
}
async function editMemberPrompt(memberId){
  const m = findMember(memberId);
  const newName = prompt('Edit name for '+m.name, m.name);
  if(newName===null || !newName.trim()) return;
  const res = await editMemberName(memberId, newName.trim());
  if(res.error) return alert(res.error);
  await loadAll(); renderAdmin();
}
async function sendBroadcast(){
  const text = document.getElementById('broadcastText').value.trim();
  if(!text) return;
  const res = await broadcastMessage(text);
  if(res.error) return alert(res.error);
  alert('Broadcast sent to '+res.count+' member(s).');
  document.getElementById('broadcastText').value='';
  await loadAll();
}

boot();
</script>
