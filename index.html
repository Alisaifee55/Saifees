  .row{display:flex;gap:8px;}

  .tabbar button{flex:1;background:none;border-radius:0;padding:10px 2px;font-size:11px;color:var(--muted);font-weight:600;}
  .tabbar button.active{color:var(--orange);}
  .tabicon{display:block;font-size:18px;margin-bottom:2px;}
  .muted{color:var(--muted);font-size:12px;}
  .memberrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F1EBE1;}
  .memberrow:last-child{border-bottom:none;}
  .pill{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid #ddd;background:#fff;}
  .pill.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .pill.off{background:var(--orange);color:#fff;border-color:var(--orange);}
  .calhead{background:var(--orange-light);border-radius:12px;padding:10px;text-align:center;font-weight:800;color:var(--orange-dark);letter-spacing:.5px;margin-bottom:12px;font-family:'FatemiQanz','Segoe UI',sans-serif;}

  .empty{visibility:hidden;}
  .notif-item{padding:8px 0;border-bottom:1px solid #f1ebe1;font-size:13px;}
  .msgline{padding:8px 10px;border-radius:12px;margin-bottom:6px;max-width:80%;font-size:13px;}
  .msg-me{background:var(--teal);color:#fff;margin-left:auto;}
  .msg-them{background:#f1ebe1;}
  a.link{color:var(--teal-dark);font-weight:700;font-size:13px;cursor:pointer;}
  .banner{background:#fff3cd;border:1px solid #ffe08a;color:#7a5b00;padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:12px;}

<script>
/* =========== CONFIG =========== */
// Paste your deployed Google Apps Script Web App URL here (ends in /exec)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywE59_chzmhx63j7k3dx4tv4Maat_-cJt6RD4VdEvQspW53CIi_pDmmvfXD4R35XFssw/exec";

/* ================= Hijri conversion (tabular / "Kuwaiti" algorithm, ~1 day accuracy) ================= */
function gregorianToHijri(gy, gm, gd){
  let jd = Math.floor((1461*(gy + 4800 + Math.floor((gm-14)/12)))/4) +
           Math.floor((367*(gm-2-12*Math.floor((gm-14)/12)))/12) -
           Math.floor((3*Math.floor((gy+4900+Math.floor((gm-14)/12))/100))/4) +
           gd - 32075;
  let l = jd - 1948440 + 10632;
  let n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  let j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  let hm = Math.floor((24*l)/709);
  let hd = l - Math.floor((709*hm)/24);
  let hy = 30*n + j - 30;
  return {hy, hm, hd};
}
const HIJRI_MONTHS = ["Muharram","Safar","Rabi al-Awwal","Rabi al-Akhar","Jumada al-Ula","Jumada al-Akhira","Rajab","Sha'ban","Ramadan","Shawwal","Dhul Qadah","Dhul Hijjah"];
function hijriToGregorian(hy, hm, hd){
  const jd = hd + Math.ceil(29.5*(hm-1)) + (hy-1)*354 + Math.floor((3+11*hy)/30) + 1948440 - 1;
  let l = jd + 68569;
  const n = Math.floor((4*l)/146097);
  l = l - Math.floor((146097*n+3)/4);
  const i = Math.floor((4000*(l+1))/1461001);
  l = l - Math.floor((1461*i)/4) + 31;
  const j = Math.floor((80*l)/2447);
  const day = l - Math.floor((2447*j)/80);
  l = Math.floor(j/11);
  const month = j + 2 - 12*l;
  const year = 100*(n-49) + i + l;
  return new Date(year, month-1, day);
}
const HIJRI_MONTHS_AR = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
function findHijriMonthStart(hy, hm){
  // hijriToGregorian is only ~1 day accurate; self-correct so it round-trips exactly to hd=1
  let guess = hijriToGregorian(hy, hm, 1);
  for(let attempts=0; attempts<8; attempts++){
    const h = gregorianToHijri(guess.getFullYear(), guess.getMonth()+1, guess.getDate());
    if(h.hy===hy && h.hm===hm && h.hd===1) break;
    if(h.hy===hy && h.hm===hm){
      guess.setDate(guess.getDate() + (1 - h.hd));
    } else {
      const beforeTarget = (h.hy<hy) || (h.hy===hy && h.hm<hm);
      guess.setDate(guess.getDate() + (beforeTarget ? 1 : -1));
    }
  }
  return guess;
}
const ARABIC_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicNum(n){ return String(n).split('').map(c=>ARABIC_DIGITS[+c]||c).join(''); }
function ymdKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= Backend calls (Google Apps Script) ================= */
async function callApi(action, payload){
  if (APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
    alert('Backend not connected yet: paste your Apps Script Web App URL into APPS_SCRIPT_URL in the code.');
    throw new Error('APPS_SCRIPT_URL not set');
  }
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout instead of hanging forever
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    let data;
    try { data = await res.json(); }
    catch(parseErr) { throw new Error('Backend did not return valid JSON. Check that your Apps Script Web App is deployed with "Anyone" access and that you redeployed a new version after any code changes.'); }
    if (data.error) throw new Error(data.error);
    return data;
  } catch(err) {
    clearTimeout(timeoutId);
    if (err.name === 'AbortError') throw new Error('The backend took too long to respond (15s timeout). Check your Apps Script URL and deployment.');
    throw err;
  }
}

let DB = { families: [], members: [], events: [], votes: [], messages: [], notifications: [] };
let session = null;
let activeTab = 'calendar';
let hijriViewY = null, hijriViewM = null; // initialized on first render from today's date
let notifOpen = false;
const ADMIN_PASSCODE = "admin123"; // change this for your real deployment

async function loadDB(){
  try { DB = await callApi('getAll', {}); }
  catch(e){ console.error(e); }
}
function membersOfFamily(familyId){ return DB.members.filter(m=>m.familyId===familyId); }
function findMember(memberId){ return DB.members.find(m=>m.id===memberId); }

function registerPushForMember(memberId){
  window.__pendingExternalId = memberId;
  if (window.__oneSignalReady && window.OneSignal) {
    OneSignalDeferred.push(async function(OneSignal){ OneSignal.login(memberId); });
  }
}

/* ================= Render root ================= */
async function boot(){
  try {
    DB = await callApi('getAll', {});
    render();
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div style="padding:30px;text-align:center;">
        <h2 style="color:#8E2A2A;">Couldn't reach the backend</h2>
        <p class="muted">${escapeHtml(e.message)}</p>
        <button class="btn-primary" style="max-width:200px;margin:10px auto;" onclick="boot()">Retry</button>
      </div>`;
  }
}
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="topbar">
      <div>
        <div style="background:#fff;border-radius:10px;padding:4px 10px;display:inline-block;">
          <img src="logo-transparent.png" alt="Saifee's Calendar" style="height:32px;display:block;">
        </div>
        <div class="who">${session ? escapeHtml(session.name)+' · '+session.role : 'Not logged in'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        ${session && session.role!=='admin' ? bellHtml() : ''}
        ${session ? `<a class="link" style="color:#fff;" onclick="logout()">Logout</a>` : ''}
      </div>
    </header>
    <main id="main"></main>
    ${session ? tabbarHtml() : ''}
  `;
  if(!session){ renderAuth(); return; }
  if(notifOpen){ renderNotifPanel(); return; }
  if(activeTab==='calendar') renderCalendar();
  else if(activeTab==='vote') renderVote();
  else if(activeTab==='presence') renderPresence();
  else if(activeTab==='messages') renderMessages();
  else if(activeTab==='admin') renderAdmin();
}
function bellHtml(){
  const list = DB.notifications.filter(n=>n.memberId===session.memberId).sort((a,b)=>new Date(b.at)-new Date(a.at));
  const unread = list.filter(n=>n.read!==true && n.read!=='TRUE').length;
  return `<div class="bell" onclick="toggleNotif()">🔔${unread?`<span class="dot">${unread}</span>`:''}</div>`;
}
async function toggleNotif(){
  notifOpen = !notifOpen;
  if(notifOpen){ await callApi('markNotifRead', {memberId: session.memberId}); await loadDB(); }
  render();
}
function renderNotifPanel(){
  const main = document.getElementById('main');
  const list = DB.notifications.filter(n=>n.memberId===session.memberId).sort((a,b)=>new Date(b.at)-new Date(a.at));
  main.innerHTML = `<div class="card"><h2>Notifications</h2>
    <a class="link" onclick="toggleNotif()">&larr; Back</a><div style="height:8px;"></div>
    ${list.length? list.map(n=>`<div class="notif-item">${escapeHtml(n.text)}<div class="muted">${new Date(n.at).toLocaleString()}</div></div>`).join('') : '<div class="muted">No notifications yet.</div>'}
  </div>`;
}
function tabbarHtml(){
  const tabs = [
    {id:'calendar', icon:'📅', label:'Calendar'},
    {id:'vote', icon:'✅', label:'Vote'},
    {id:'presence', icon:'👥', label:'Presence'},
    {id:'messages', icon:'💬', label:'Messages'},
  ];
  if(session.role==='admin') tabs.push({id:'admin', icon:'⚙️', label:'Admin'});
  return `<div class="tabbar">${tabs.map(t=>`
    <button class="${activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">
      <span class="tabicon">${t.icon}</span>${t.label}
    </button>`).join('')}</div>`;
}
async function setTab(t){ activeTab=t; notifOpen=false; await loadDB(); render(); }
function logout(){ session=null; activeTab='calendar'; render(); }

/* ================= AUTH ================= */
let authMode = 'login';
function renderAuth(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <h2>Welcome</h2>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn-secondary btn-small" onclick="authMode='login';render()">Family / Member Login</button>
        <button class="btn-secondary btn-small" onclick="authMode='registerFamily';render()">Register Family</button>
      </div>
      <a class="link" onclick="authMode='adminLogin';render()">Admin login</a>
      <div id="authbody" style="margin-top:14px;"></div>
    </div>`;
  const body = document.getElementById('authbody');
  if(authMode==='login'){
    body.innerHTML = `
      <input id="loginName" placeholder="Family name or your unique member name">
      <input id="loginPass" type="password" placeholder="Password">
      <button class="btn-primary" onclick="doLogin()">Login</button>`;
  } else if(authMode==='registerFamily'){
    body.innerHTML = `
      <input id="regFamilyName" placeholder="Family name (must be unique)">
      <input id="regHeadName" placeholder="Your name (family head)">
      <input id="regPass" type="password" placeholder="Choose a password">
      <button class="btn-primary" onclick="doRegisterFamily()">Register Family</button>`;
  } else if(authMode==='adminLogin'){
    body.innerHTML = `
      <input id="adminPass" type="password" placeholder="Admin passcode">
      <button class="btn-primary" onclick="doAdminLogin()">Login as Admin</button>`;
  }
}
async function doRegisterFamily(){
  const name = document.getElementById('regFamilyName').value.trim();
  const headName = document.getElementById('regHeadName').value.trim();
  const password = document.getElementById('regPass').value;
  if(!name || !headName || !password) return alert('Please fill all fields.');
  try{
    const res = await callApi('registerFamily', {name, headName, password});
    if(res.error) return alert(res.error);
    session = {role:'head', familyId:res.familyId, memberId:res.memberId, name:res.name};
    registerPushForMember(res.memberId);
    await loadDB();
    authMode='login';
    render();
  }catch(e){ alert('Error: '+e.message); }
}
async function doLogin(){
  const name = document.getElementById('loginName').value.trim();
  const password = document.getElementById('loginPass').value;
  try{
    const res = await callApi('login', {name, password});
    if(res.error) return alert(res.error);
    session = {role:res.role, familyId:res.familyId, memberId:res.memberId, name:res.name};
    registerPushForMember(res.memberId);
    await loadDB();
    render();
  }catch(e){ alert('Error: '+e.message); }
}
async function doAdminLogin(){
  const pass = document.getElementById('adminPass').value;
  if(pass !== ADMIN_PASSCODE) return alert('Incorrect passcode.');
  session = {role:'admin', name:'Super Admin', memberId:'ADMIN'};
  await loadDB();
  render();
}

function shiftHijriMonth(delta){
  hijriViewM += delta;
  if(hijriViewM > 12){ hijriViewM = 1; hijriViewY++; }
  if(hijriViewM < 1){ hijriViewM = 12; hijriViewY--; }
  render();
}
function goToTodayHijri(){
  const now = new Date();
  const h = gregorianToHijri(now.getFullYear(), now.getMonth()+1, now.getDate());
  hijriViewY = h.hy; hijriViewM = h.hm;
  render();
}
/* ================= CALENDAR ================= */
function renderCalendar(){
  const main = document.getElementById('main');
  const now = new Date();
  if(hijriViewY === null){
    const h0 = gregorianToHijri(now.getFullYear(), now.getMonth()+1, now.getDate());
    hijriViewY = h0.hy; hijriViewM = h0.hm;
  }
  const monthLabel = `${HIJRI_MONTHS[hijriViewM-1].toUpperCase()} - ${hijriViewY}`;
  const monthStart = findHijriMonthStart(hijriViewY, hijriViewM);

  // find length of this hijri month by walking forward until the hijri month/year changes
  let length = 0;
  let walker = new Date(monthStart);
  while(true){
    const h = gregorianToHijri(walker.getFullYear(), walker.getMonth()+1, walker.getDate());
    if(h.hy===hijriViewY && h.hm===hijriViewM){ length++; walker.setDate(walker.getDate()+1); }
    else break;
  }

  const firstDow = monthStart.getDay();
  const cells = [];
  // leading days (previous hijri month, greyed)
  for(let i=firstDow; i>=1; i--){
    const dt = new Date(monthStart); dt.setDate(dt.getDate()-i);
    cells.push({date:dt, grey:true});
  }
  // this month's days
  for(let d=0; d<length; d++){
    const dt = new Date(monthStart); dt.setDate(dt.getDate()+d);
    cells.push({date:dt, grey:false});
  }
  // trailing days (next hijri month, greyed) to complete the grid
  const remainder = cells.length % 7;
  if(remainder !== 0){
    const extra = 7 - remainder;
    for(let i=0;i<extra;i++){
      const dt = new Date(monthStart); dt.setDate(dt.getDate()+length+i);
      cells.push({date:dt, grey:true});
    }
  }

  let cellsHtml = cells.map(c=>{
    const date = c.date;
    const h = gregorianToHijri(date.getFullYear(), date.getMonth()+1, date.getDate());
    const key = ymdKey(date);
    const isToday = ymdKey(now)===key;
    const isPast = date < new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const ev = DB.events.find(e=>e.gDate && ymdKey(new Date(e.gDate))===key);
    let cls = 'calday';
    if(isToday) cls+=' today';
    else if(ev) cls+=' event';
    else if(isPast && !c.grey) cls+=' past';
    if(c.grey) cls+=' greyday';
    const gLabel = date.getDate()===1
      ? `${date.getDate()} ${date.toLocaleString('en',{month:'short'})}`
      : `${date.getDate()}`;
    return `<div class="${cls}" ${ev?`onclick="openEventDetail('${ev.id}')"`:''} style="${ev?'cursor:pointer':''}">
      <div class="h">${toArabicNum(h.hd)}</div>
      <div class="g">${gLabel}</div>
      ${ev?'<div class="dot"></div>':''}
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:8px;">
        <button class="btn-secondary btn-small" onclick="shiftHijriMonth(-1)">&larr; Prev</button>
        <button class="btn-secondary btn-small" onclick="goToTodayHijri()">Today</button>
        <button class="btn-secondary btn-small" onclick="shiftHijriMonth(1)">Next &rarr;</button>
      </div>
      <div class="calhead">${monthLabel}<div style="font-size:19px;margin-top:4px;font-family:'FatemiQanz','Segoe UI',sans-serif;" dir="rtl">${HIJRI_MONTHS_AR[hijriViewM-1]}</div></div>
      <div class="calgrid">
        ${['S','M','T','W','T','F','S'].map(d=>`<div class="caldow">${d}</div>`).join('')}
        ${cellsHtml}
      </div>
      <div class="muted" style="margin-top:10px;">Tap a highlighted date to see totals. Orange dot = meal event scheduled. Greyed dates belong to the adjacent Hijri month.</div>
    </div>
    <div id="eventDetail"></div>
  `;
}
function openEventDetail(eventId){
  const ev = DB.events.find(e=>e.id===eventId);
  const votes = DB.votes.filter(v=>v.eventId===eventId);
  const count = (meal,resp)=>votes.filter(v=>v.meal===meal && v.response===resp).length;
  document.getElementById('eventDetail').innerHTML = `
    <div class="card">
      <h2>${new Date(ev.gDate).toDateString()} — ${ev.status==='closed'?'Closed':'Open'} (deadline ${new Date(ev.deadline).toLocaleString()})</h2>
      <div class="row">
        <div><b>Lunch</b><br><span class="tag tag-yes">Yes ${count('Lunch','Yes')}</span> <span class="tag tag-no">No ${count('Lunch','No')}</span></div>
        <div><b>Dinner</b><br><span class="tag tag-yes">Yes ${count('Dinner','Yes')}</span> <span class="tag tag-no">No ${count('Dinner','No')}</span></div>
      </div>
      ${session.role==='admin' ? adminFamilyBreakdown(eventId) : ''}
    </div>`;
}
function adminFamilyBreakdown(eventId){
  const rows = DB.families.map(f=>{
    const memberIds = membersOfFamily(f.id).map(m=>m.id);
    const v = DB.votes.filter(x=>x.eventId===eventId && memberIds.includes(x.memberId));
    const yes = v.filter(x=>x.response==='Yes').length;
    const no = v.filter(x=>x.response==='No').length;
    return `<div class="memberrow"><span>${escapeHtml(f.name)}</span><span class="muted">Yes ${yes} / No ${no}</span></div>`;
  }).join('');
  return `<div style="margin-top:10px;"><b class="muted">By family</b>${rows}</div>`;
}

/* ================= VOTE ================= */
function renderVote(){
  const main = document.getElementById('main');
  if(session.role==='admin'){
    main.innerHTML = `<div class="card"><h2>Voting is per-family</h2><div class="muted">Log in as a family to vote. Use the Admin tab to manage events.</div></div>`;
    return;
  }
  const openEvents = DB.events.filter(e=>e.status!=='closed' && new Date(e.deadline) > new Date());
  const closedEvents = DB.events.filter(e=>e.status==='closed' || new Date(e.deadline) <= new Date());
  main.innerHTML = `
    <div class="card">
      <h2>Open events</h2>
      ${openEvents.length? openEvents.map(e=>`
        <div class="memberrow">
          <span>${new Date(e.gDate).toDateString()}<br><span class="muted">Deadline: ${new Date(e.deadline).toLocaleString()}</span></span>
          <button class="btn-primary btn-small" onclick="openVoteGrid('${e.id}')">Vote</button>
        </div>`).join('') : '<div class="muted">No open events right now.</div>'}
    </div>
    <div id="voteGrid"></div>
    <div class="card">
      <h2>Past / closed events</h2>
      ${closedEvents.length? closedEvents.map(e=>`<div class="memberrow"><span>${new Date(e.gDate).toDateString()}</span><span class="muted">Closed</span></div>`).join('') : '<div class="muted">None yet.</div>'}
    </div>
  `;
}
function openVoteGrid(eventId){
  const fam = membersOfFamily(session.familyId);
  const rows = fam.map(m=>{
    const lv = DB.votes.find(v=>v.eventId===eventId && v.memberId===m.id && v.meal==='Lunch');
    const dv = DB.votes.find(v=>v.eventId===eventId && v.memberId===m.id && v.meal==='Dinner');
    return `<div class="memberrow">
      <span>${escapeHtml(m.name)}</span>
      <span class="row" style="gap:4px;">
        <button class="pill ${lv&&lv.response==='Yes'?'on':''}" onclick="castVote('${eventId}','${m.id}','Lunch','Yes')">L:Yes</button>
        <button class="pill ${lv&&lv.response==='No'?'off':''}" onclick="castVote('${eventId}','${m.id}','Lunch','No')">L:No</button>
        <button class="pill ${dv&&dv.response==='Yes'?'on':''}" onclick="castVote('${eventId}','${m.id}','Dinner','Yes')">D:Yes</button>
        <button class="pill ${dv&&dv.response==='No'?'off':''}" onclick="castVote('${eventId}','${m.id}','Dinner','No')">D:No</button>
      </span>
    </div>`;
  }).join('');
  document.getElementById('voteGrid').innerHTML = `<div class="card"><h2>${new Date(DB.events.find(e=>e.id===eventId).gDate).toDateString()}</h2>${rows}</div>`;
}
async function castVote(eventId, memberId, meal, response){
  const ev = DB.events.find(e=>e.id===eventId);
  if(new Date(ev.deadline) <= new Date() || ev.status==='closed'){ alert('Voting is closed for this date.'); return; }
  try{
    await callApi('castVote', {eventId, memberId, meal, response, submittedBy: session.memberId});
    await loadDB();
    openVoteGrid(eventId);
  }catch(e){ alert('Error: '+e.message); }
}

/* ================= PRESENCE ================= */
function renderPresence(){
  const main = document.getElementById('main');
  const latestEvent = [...DB.events].sort((a,b)=>new Date(b.gDate)-new Date(a.gDate))[0];
  const famName = id => (DB.families.find(f=>f.id===id)||{}).name || '';
  const rows = DB.members.map(m=>{
    const online = m.lastSeen && (new Date() - new Date(m.lastSeen)) < 5*60*1000;
    let votedTxt = '—';
    if(latestEvent){
      const voted = DB.votes.some(v=>v.eventId===latestEvent.id && v.memberId===m.id);
      votedTxt = voted ? 'Voted' : 'Not voted yet';
    }
    return `<div class="memberrow">
      <span>${escapeHtml(m.name)}<br><span class="muted">${famName(m.familyId)}</span></span>
      <span style="text-align:right;">
        <div class="pill ${online?'on':''}" style="display:inline-block;">${online?'Online':'Offline'}</div>
        <div class="muted">${online?'':'Last seen '+(m.lastSeen? new Date(m.lastSeen).toLocaleString():'never')}</div>
        <div class="muted">${votedTxt}</div>
      </span>
    </div>`;
  }).join('');
  main.innerHTML = `<div class="card"><h2>Family members</h2>${rows||'<div class="muted">No members yet.</div>'}</div>`;
}

/* ================= MESSAGES ================= */
let msgWith = null;
function renderMessages(){
  const main = document.getElementById('main');
  const famName = id => (DB.families.find(f=>f.id===id)||{}).name || '';
  const others = DB.members.filter(m=>m.id!==session.memberId);
  main.innerHTML = `
    <div class="card">
      <h2>Contacts</h2>
      ${others.map(m=>`<div class="memberrow"><span>${escapeHtml(m.name)} <span class="muted">(${famName(m.familyId)})</span></span>
        <button class="btn-secondary btn-small" onclick="openChat('${m.id}')">Message</button></div>`).join('') || '<div class="muted">No other members yet.</div>'}
    </div>
    <div id="chatBox"></div>
  `;
  if(msgWith) openChat(msgWith);
}
function openChat(memberId){
  msgWith = memberId;
  const other = findMember(memberId);
  const thread = DB.messages.filter(m =>
    (m.from===session.memberId && m.to===memberId) || (m.from===memberId && m.to===session.memberId)
  ).sort((a,b)=>new Date(a.sentAt)-new Date(b.sentAt));
  document.getElementById('chatBox').innerHTML = `
    <div class="card">
      <h2>Chat with ${escapeHtml(other.name)}</h2>
      <div style="max-height:220px;overflow-y:auto;margin-bottom:10px;">
        ${thread.map(m=>`<div class="msgline ${m.from===session.memberId?'msg-me':'msg-them'}">${escapeHtml(m.text)}</div>`).join('') || '<div class="muted">No messages yet.</div>'}
      </div>
      <input id="chatInput" placeholder="Type a message...">
      <button class="btn-primary" onclick="sendMsg('${memberId}')">Send</button>
    </div>`;
}
async function sendMsg(memberId){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  try{
    await callApi('sendMessage', {from: session.memberId, to: memberId, text});
    await loadDB();
    openChat(memberId);
  }catch(e){ alert('Error: '+e.message); }
}

/* ================= ADMIN ================= */
function renderAdmin(){
  const main = document.getElementById('main');
  const famName = id => (DB.families.find(f=>f.id===id)||{}).name || '';
  main.innerHTML = `
    <div class="card">
      <h2>Create meal event</h2>
      <input id="evDate" type="date">
      <input id="evDeadline" type="datetime-local">
      <button class="btn-primary" onclick="createEvent()">Create event</button>
    </div>
    <div class="card">
      <h2>All events</h2>
      ${DB.events.length? DB.events.map(e=>`
        <div class="memberrow">
          <span>${new Date(e.gDate).toDateString()}<br><span class="muted">Deadline ${new Date(e.deadline).toLocaleString()} · ${e.status==='closed'?'Closed':'Open'}</span></span>
          <span>
            <button class="btn-secondary btn-small" onclick="toggleEventStatus('${e.id}')">${e.status==='closed'?'Reopen':'Close'}</button>
            <button class="btn-secondary btn-small" onclick="sendReminders('${e.id}')">Remind</button>
          </span>
        </div>`).join('') : '<div class="muted">No events yet.</div>'}
    </div>
    <div class="card">
      <h2>Edit member details</h2>
      ${DB.members.map(m=>`
        <div class="memberrow">
          <span>${escapeHtml(m.name)} <span class="muted">(${famName(m.familyId)})</span></span>
          <button class="btn-secondary btn-small" onclick="editMember('${m.id}')">Edit</button>
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>Broadcast message to everyone</h2>
      <input id="broadcastText" placeholder="Message to all members">
      <button class="btn-primary" onclick="sendBroadcast()">Send to all</button>
    </div>
  `;
}
async function createEvent(){
  const d = document.getElementById('evDate').value;
  const dl = document.getElementById('evDeadline').value;
  if(!d || !dl) return alert('Pick a date and deadline.');
  try{ await callApi('createEvent', {gDate:d, deadline:dl}); await loadDB(); renderAdmin(); }
  catch(e){ alert('Error: '+e.message); }
}
async function toggleEventStatus(eventId){
  try{ await callApi('toggleEvent', {eventId}); await loadDB(); renderAdmin(); }
  catch(e){ alert('Error: '+e.message); }
}
async function sendReminders(eventId){
  try{
    const res = await callApi('sendReminders', {eventId});
    alert(`Reminder sent to ${res.count} member(s) who haven't voted.`);
    await loadDB();
  }catch(e){ alert('Error: '+e.message); }
}
async function editMember(memberId){
  const m = findMember(memberId);
  const newName = prompt('Edit name for '+m.name, m.name);
  if(newName===null || !newName.trim()) return;
  try{
    const res = await callApi('editMember', {memberId, newName: newName.trim()});
    if(res.error) return alert(res.error);
    await loadDB();
    renderAdmin();
  }catch(e){ alert('Error: '+e.message); }
}
async function sendBroadcast(){
  const text = document.getElementById('broadcastText').value.trim();
  if(!text) return;
  try{
    const res = await callApi('broadcast', {text});
    alert('Broadcast sent to '+res.count+' member(s).');
    document.getElementById('broadcastText').value='';
    await loadDB();
  }catch(e){ alert('Error: '+e.message); }
}

boot();
</script>
</body>
</html>
